      <div class="ed-ft"><span class="ed-keys">${ed==='vi'?'<b>⌃S</b> / <b>Esc</b> to write &amp; quit (vi <b>:wq</b>)':'<b>⌃O</b>/<b>⌃S</b> Save · <b>⌃X</b>/<b>Esc</b> Exit'}</span><span><button class="ed-btn ed-save">Save &amp; Exit</button> <button class="ed-btn ghost ed-cancel">Cancel</button></span></div></div>`;
    v.appendChild(ov);
    const ta=ov.querySelector('.ed-ta');ta.value=fileContent(path);ta.focus();try{ta.setSelectionRange(ta.value.length,ta.value.length);}catch(e){}
    const close=()=>{ov.remove();const inp=body.querySelector('.term-input:not([disabled])');if(inp)inp.focus();};
    const save=()=>{parseInto(path,ta.value);line(`<span class="ok">[ Wrote ${ta.value.split(/\n/).length} lines to ${esc(ap)} ]</span>`);refresh();close();};
    ov.querySelector('.ed-save').onclick=save;
    ov.querySelector('.ed-cancel').onclick=close;
    ta.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='o'||e.key==='x')){e.preventDefault();save();}else if(e.key==='Escape'){e.preventDefault();save();}});
  }
  function newPrompt(){
    title.textContent='student@'+LS.cur;
    const row=document.createElement('div');row.className='term-inrow';row.innerHTML=`<span class="term-prompt">student@${LS.cur}:~$</span> `;
    const inp=document.createElement('input');inp.className='term-input';inp.setAttribute('autocomplete','off');inp.setAttribute('spellcheck','false');
    row.appendChild(inp);body.appendChild(row);inp.focus();body.scrollTop=body.scrollHeight;
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){const raw=inp.value;inp.disabled=true;hi=-1;const hostAt=LS.cur;row.innerHTML=`<span class="term-prompt">student@${hostAt}:~$</span> <span>${esc(raw)}</span>`;if(raw.trim())hist.push(raw);
        const out=run(raw);
        if(raw.trim()){history.push({host:hostAt,cmd:normCmd(raw)});refresh();}
        if(out===null){newPrompt();return;} if(out!=='')line(out); newPrompt(); e.preventDefault();}
      else if(e.key==='ArrowUp'){if(hist.length){hi=hi<0?hist.length-1:Math.max(0,hi-1);inp.value=hist[hi];setTimeout(()=>inp.setSelectionRange(inp.value.length,inp.value.length),0);}e.preventDefault();}
      else if(e.key==='ArrowDown'){if(hi>=0){hi++;if(hi>=hist.length){hi=-1;inp.value='';}else inp.value=hist[hi];}e.preventDefault();}
      else if(e.key==='Tab'){e.preventDefault();complete(inp);}
    });
    return inp;
  }
  line(`<span class="cy">Splunk Data Admin — Guided Lab</span>. You are on <b>mgmt1</b> (the jump/management host).`);
  line(`<span class="dim">Pick a module on the right and follow the steps. Commands really change the (simulated) config. Type</span> <span class="ok">splunk help</span><span class="dim"> or click a command to insert it.</span>`);
  refresh();
  newPrompt();
  body.addEventListener('click',()=>{const inp=body.querySelector('.term-input:not([disabled])');if(inp)inp.focus();});
  show(v);
  requestAnimationFrame(()=>{const inp=body.querySelector('.term-input:not([disabled])');if(inp)inp.focus();});
}

/* ============ CONCEPT MASTERY — deep-dive explainers ============ */
function conceptsScreen(){
  currentRender=conceptsScreen; S.onKey=null; try{clearTimer();}catch(e){}
  const D='https://docs.splunk.com/Documentation/Splunk/latest/';
  const CONCEPTS=[
    {icon:'⚖️',title:'Config File Precedence',tag:'hardest',why:`There are <b>two</b> different orderings depending on context, and precedence decides which value actually &lsquo;wins&rsquo; when the same setting appears in multiple files.`,
     body:`<p>The one rule that&rsquo;s always true: <b>within a directory, <code>local</code> beats <code>default</code></b>. Never edit <code>default/</code> — upgrades overwrite it. Put changes in <code>local/</code>.</p>
     <p>Which <i>directory</i> wins depends on the context:</p>
     <table class="ctable"><tr><th>Context</th><th>Order (highest → lowest)</th><th>Used for</th></tr>
     <tr><td><b>Global</b></td><td>system/local → app local → app default → system/default</td><td>server.conf, indexes.conf, inputs/outputs on forwarders</td></tr>
     <tr><td><b>App / user</b> (search-time)</td><td>user dir → current-app local → current-app default → other apps → system</td><td>savedsearches, props/transforms used at search time, macros</td></tr></table>
     <p>Files merge <b>setting by setting</b> — a higher-precedence file overrides only the keys it defines; everything else falls through to lower files.</p>`,
     example:`# global context example\n$SPLUNK_HOME/etc/system/local/server.conf   → serverName = splunk-lab   ✅ WINS\n$SPLUNK_HOME/etc/apps/foo/default/server.conf → serverName = foo        (loses)`,
     gotcha:`Don&rsquo;t guess the winner — run <code>splunk btool &lt;conf&gt; list --debug</code> and it prints the source file of every effective setting.`,doc:D+'Admin/Wheretofindtheconfigurationfiles'},
    {icon:'🎯',title:'Event Type Priority',tag:'counter-intuitive',why:`A <b>lower</b> priority number means a <b>higher</b> priority — the opposite of what most people assume.`,
     body:`<p>Priority ranges <b>1 (best) to 10 (worst)</b>; the default is <b>5</b>. When one event matches multiple event types, Splunk orders them by priority and the <b>best (lowest-number) event type&rsquo;s color</b> is the one displayed. Only one color shows per event.</p>`,
     example:`event matches:\n  critical_error  (priority 1)  ← WINS, its color displays\n  all_errors      (priority 5)`,
     gotcha:`Priority <b>1 beats priority 10</b>. If colors aren&rsquo;t showing as expected, check the priority numbers.`,doc:D+'Knowledge/Abouteventtypes'},
    {icon:'🔧',title:'btool',tag:'must-know',why:`It shows the <b>merged, on-disk</b> configuration — not the running config and not any single file — so people misread what it&rsquo;s telling them.`,
     body:`<p>Syntax: <code>splunk btool &lt;conf&gt; list [stanza] [--debug]</code>. It merges every layer of a <code>.conf</code> and prints the effective result. Add <code>--debug</code> to prefix each line with the <b>file it came from</b>. <code>splunk btool check</code> validates configs for errors.</p>`,
     example:`splunk btool inputs list --debug\n/opt/splunk/etc/apps/search/local/inputs.conf  [monitor:///var/log/web/access.log]\n/opt/splunk/etc/apps/search/local/inputs.conf  index = test\n/opt/splunk/etc/system/default/inputs.conf     _rcvbuf = 1572864`,
     gotcha:`btool reads <b>files on disk</b>, not what&rsquo;s loaded in memory — after editing a file you must <b>restart</b> for Splunk to actually use it.`,doc:D+'Troubleshooting/Usebtooltotroubleshootconfigurations'},
    {icon:'📥',title:'inputs.conf',tag:'core',why:`One file, many stanza types — and it&rsquo;s easy to confuse what belongs in inputs.conf vs outputs.conf.`,
     body:`<p><b>inputs.conf</b> defines what data Splunk <b>collects</b>, by stanza type:</p>
     <ul><li><code>[monitor://&lt;path&gt;]</code> — watch a file/dir</li><li><code>[splunktcp://9997]</code> — <b>receive</b> from forwarders (created by <code>splunk enable listen 9997</code>)</li><li><code>[tcp://&lt;port&gt;]</code> / <code>[udp://514]</code> — network inputs (e.g. syslog)</li><li><code>[script://&lt;path&gt;]</code> — scripted input</li></ul>
     <p>Common attributes: <code>index</code>, <code>sourcetype</code>, <code>host</code>, <code>disabled</code>.</p>`,
     example:`[monitor:///var/log/secure]\ndisabled = false\nindex = os\nsourcetype = linux_secure`,
     gotcha:`On a forwarder, <b>inputs.conf = what to collect</b>, <b>outputs.conf = where to send</b>. Mixing them up is a classic exam trap.`,doc:D+'Data/Monitorfilesanddirectories'},
    {icon:'📜',title:'Licensing',tag:'high-weight',why:`Several license types, a manager/peer split, and a specific violation rule that&rsquo;s easy to misremember.`,
     body:`<table class="ctable"><tr><th>Type</th><th>Notes</th></tr>
     <tr><td><b>Enterprise</b></td><td>Licensed daily <b>indexing volume</b></td></tr>
     <tr><td><b>Free</b></td><td><b>500 MB/day</b>; disables auth, alerting, distributed search, clustering</td></tr>
     <tr><td><b>Forwarder</b></td><td>Unlimited forwarding, no indexing</td></tr>
     <tr><td><b>Trial</b></td><td>60-day Enterprise, then reverts to Free</td></tr></table>
     <p>The <b>license manager</b> holds the license; indexers are <b>license peers</b> that report daily usage to it. An Enterprise <b>violation</b> = more than <b>5 warnings</b> in a rolling <b>30-day</b> window.</p>`,
     gotcha:`License is measured on data <b>indexed per day</b>, not stored. Lower it by <b>filtering at ingest</b> (nullQueue / Ingest Actions) — deleting old data does nothing.`,doc:D+'Admin/HowSplunklicensingworks'},
    {icon:'🔀',title:'Heavy vs Universal Forwarder',tag:'always-tested',why:`They look similar but differ in one decisive way: whether they parse.`,
     body:`<table class="ctable"><tr><th></th><th>Universal Forwarder</th><th>Heavy Forwarder</th></tr>
     <tr><td>What it is</td><td>Lightweight agent</td><td>Full Splunk Enterprise (forwarding mode)</td></tr>
     <tr><td>Parses data?</td><td><b>No</b> — forwards mostly raw</td><td><b>Yes</b> — parse, filter, route</td></tr>
     <tr><td>Footprint / Web UI</td><td>Tiny / none</td><td>Large / has UI</td></tr>
     <tr><td>Can index/search?</td><td>No</td><td>Yes (but usually just forwards)</td></tr></table>
     <p>Use a <b>UF by default</b> (scale, low overhead). Use an <b>HF</b> only when you need to <b>parse/filter/route before indexing</b> (e.g. nullQueue routing) or run inputs that require a full instance (DB Connect, some TAs).</p>`,
     gotcha:`<b>Parsing happens on an HF or indexer, never a UF.</b> That single fact answers most HF-vs-UF questions.`,doc:D+'Forwarder/Abouttheuniversalforwarder'},
    {icon:'🗄️',title:'Bucket Lifecycle & Retention',tag:'core',why:`Four bucket states plus two independent limits (age and size) that both trigger freezing.`,
     body:`<p>Buckets age <b>hot → warm → cold → frozen</b>. Only <b>hot</b> is writable; warm and cold are read-only but searchable (cold usually on cheaper storage). <b>Frozen</b> means the data <b>leaves the index</b>.</p>
     <ul><li><code>frozenTimePeriodInSecs</code> — freeze by <b>age</b></li><li><code>maxTotalDataSizeMB</code> — freeze by <b>size</b> (oldest first)</li></ul>
     <p>Whichever limit is hit <b>first</b> wins.</p>`,
     gotcha:`Frozen data is <b>deleted by default</b> — set <code>coldToFrozenDir</code> to archive it instead.`,doc:D+'Indexer/HowSplunkstoresindexes'},
    {icon:'📡',title:'Deployment Server & Server Classes',tag:'admin',why:`Several moving parts (clients, apps, server classes) and a precedence catch that breaks central management.`,
     body:`<p>The <b>deployment server</b> pushes <b>deployment apps</b> (staged in <code>etc/deployment-apps</code>) to <b>deployment clients</b> — forwarders that poll it (<code>splunk set deploy-poll mgr:8089</code>). A <b>server class</b> groups clients by filters and maps them to the apps they should receive. <code>splunk reload deploy-server</code> applies changes; clients pull on their next <b>phone-home</b>.</p>`,
     gotcha:`Settings in a client&rsquo;s <code>system/local</code> can&rsquo;t be overridden by a deployed app (system/local wins) — that&rsquo;s why you <b>delete the local outputs.conf</b> before managing forwarders centrally.`,doc:D+'Updating/Aboutdeploymentserver'},
    {icon:'⏱️',title:'Index-time vs Search-time',tag:'best-practice',why:`Deciding when a field is created affects storage, flexibility, and whether you can change it later.`,
     body:`<p><b>Index-time</b> (baked in at ingest): <code>host</code>, <code>source</code>, <code>sourcetype</code>, <code>_time</code>, and index-time extractions. Costly and <b>permanent</b> — changing them requires re-indexing.</p>
     <p><b>Search-time</b> (applied when you search): most field extractions, field aliases, calculated fields, lookups, event types, tags. Flexible — change any time, no re-index.</p>`,
     gotcha:`<b>Prefer search-time.</b> Index-time extractions bloat the index and can&rsquo;t be applied retroactively to already-indexed data.`,doc:D+'Knowledge/Aboutfields'},
    {icon:'🗂️',title:'Config Files Reference',tag:'core',why:`A dozen <code>.conf</code> files each own one slice of Splunk — mixing up which file does what is a steady source of wrong answers.`,
     body:`<p>Every setting lives in a <code>.conf</code> named for its job. The ones the exam expects you to recognize:</p>
     <table class="ctable"><tr><th>File</th><th>What it controls</th><th>Phase</th></tr>
     <tr><td><code>inputs.conf</code></td><td>What data to collect — monitor, tcp/udp, script, splunktcp receiver</td><td>input</td></tr>
     <tr><td><code>outputs.conf</code></td><td>Where a forwarder <b>sends</b> data (target indexers, 9997)</td><td>forward</td></tr>
     <tr><td><code>props.conf</code></td><td>Parsing per source/host/sourcetype — line breaking, timestamps; <i>references</i> transforms</td><td>parse/search</td></tr>
     <tr><td><code>transforms.conf</code></td><td>The regex rules props calls — nullQueue routing, field extractions, lookups, masking</td><td>parse/search</td></tr>
     <tr><td><code>indexes.conf</code></td><td>Index definitions, paths, retention (<code>frozenTimePeriodInSecs</code>, <code>maxTotalDataSizeMB</code>)</td><td>index</td></tr>
     <tr><td><code>server.conf</code></td><td><code>serverName</code>, server roles, clustering, general settings</td><td>—</td></tr>
     <tr><td><code>deploymentclient.conf</code></td><td>Makes a client poll a deployment server</td><td>—</td></tr>
     <tr><td><code>serverclass.conf</code></td><td>On the deployment server: groups of clients → apps</td><td>—</td></tr>
     <tr><td><code>authentication.conf</code></td><td>Auth method (LDAP/SAML) and user-to-role mapping</td><td>—</td></tr>
     <tr><td><code>authorize.conf</code></td><td>Roles and the capabilities assigned to them</td><td>—</td></tr>
     <tr><td><code>limits.conf</code></td><td>Search/resource limits (e.g. subsearch result cap, concurrency)</td><td>—</td></tr>
     <tr><td><code>web.conf</code></td><td>Splunk Web settings — UI ports, SSL for the web tier</td><td>—</td></tr></table>`,
     example:`# props.conf references a transform...\n[mysourcetype]\nTRANSFORMS-drop = drop_debug\n\n# ...and transforms.conf defines what it does\n[drop_debug]\nREGEX = DEBUG\nDEST_KEY = queue\nFORMAT = nullQueue`,
     gotcha:`Two pairings the exam loves: <b>props.conf picks <i>which</i> events, transforms.conf says <i>what to do</i></b>; and <b>inputs = collect</b> vs <b>outputs = send</b>. Don&rsquo;t swap them.`,doc:D+'Admin/Listofconfigurationfiles'},
  ];
  const CQUIZ=[
    [{q:"The same setting is in <code>$SPLUNK_HOME/etc/system/local</code> and in an app's <code>default</code> directory. In the global context, which wins?",o:["The app's default value","The system/local value","They are merged and averaged","Whichever was edited last"],a:[1],e:"In the global context, <b>system/local</b> has the highest precedence, so it wins over any app default."},
     {q:"You edited a setting in an app's <code>default/</code> directory and it reverted after an upgrade. Why?",o:["default/ is overwritten on upgrade — edits belong in local/","You must restart twice","default/ is read-only to Splunk","The setting moved to another conf file"],a:[0],e:"Never edit <code>default/</code> — upgrades replace it. Put custom settings in <code>local/</code>."},
     {q:"Within one app's config, which directory always overrides the other?",o:["default over local","local over default","They never conflict","Alphabetical order decides"],a:[1],e:"<b>local</b> always overrides <b>default</b> in the same context — the one precedence rule that's always true."}],
    [{q:"An event matches event type A (priority 2) and B (priority 8). Whose color displays?",o:["B — higher number wins","A — lower number is higher priority","Neither — colors don't apply","Both colors blend"],a:[1],e:"Lower number = higher priority, so priority <b>2 beats 8</b>. Only one color shows per event."},
     {q:"What is the default event type priority?",o:["1","5","10","0"],a:[1],e:"The default priority is <b>5</b>, the middle of the 1–10 range."},
     {q:"Which statement about event type priority is TRUE?",o:["Priority 10 outranks priority 1","A lower number means higher priority","Priority controls indexing speed","Every matching event type shows its color"],a:[1],e:"<b>Lower number = higher priority.</b> It affects listing order and which single color shows."}],
    [{q:"You edited inputs.conf but haven't restarted. What does <code>splunk btool inputs list</code> show?",o:["The value loaded in memory","The merged on-disk value (your edit)","Nothing until restart","An error"],a:[1],e:"btool reads the <b>merged on-disk</b> config, so it shows your edit — but Splunk won't use it until you restart."},
     {q:"Which command reveals the source file of each effective setting?",o:["splunk btool <conf> list --debug","splunk show config","splunk diag","splunk list settings"],a:[0],e:"<code>--debug</code> prefixes every line with its source file — the fastest way to trace precedence."},
     {q:"How do you validate config files for errors without restarting?",o:["splunk validate","splunk btool check","splunk lint","splunk test-conf"],a:[1],e:"<code>splunk btool check</code> validates the merged configuration."}],
    [{q:"Which file defines what data Splunk <b>collects</b> (monitored files, network ports)?",o:["inputs.conf","outputs.conf","props.conf","indexes.conf"],a:[0],e:"<b>inputs.conf</b> defines the data inputs; outputs.conf defines where a forwarder sends data."},
     {q:"Which inputs.conf stanza continuously watches a file or directory?",o:["<code>[monitor://&lt;path&gt;]</code>","<code>[batch://&lt;path&gt;]</code>","<code>[script://&lt;path&gt;]</code>","<code>[tcpout://&lt;path&gt;]</code>"],a:[0],e:"<code>[monitor://...]</code> continuously watches and indexes new data."},
     {q:"Which stanza turns an instance into a <b>receiver</b> for forwarders on 9997?",o:["<code>[monitor://9997]</code>","<code>[splunktcp://9997]</code>","<code>[tcpout://9997]</code>","<code>[receive://9997]</code>"],a:[1],e:"<code>[splunktcp://9997]</code> makes it listen — created by <code>splunk enable listen 9997</code>.",d:'med'},
     {q:"Which stanza collects <b>syslog</b> over the network (classically UDP 514)?",o:["<code>[udp://514]</code>","<code>[monitor://514]</code>","<code>[splunktcp://514]</code>","<code>[script://514]</code>"],a:[0],e:"<code>[tcp://&lt;port&gt;]</code> / <code>[udp://&lt;port&gt;]</code> are network inputs; syslog is classically <b>UDP 514</b>.",d:'med'},
     {q:"Which attribute disables an input <b>without</b> deleting its stanza?",o:["<code>disabled = true</code>","<code>enabled = false</code>","<code>active = 0</code>","<code>stop = 1</code>"],a:[0],e:"<code>disabled = true</code> turns an input off while leaving the stanza in place.",d:'hard'},
     {q:"An input has no <code>index=</code> set. Where do its events go by default?",o:["The <b>main</b> index","The <code>_internal</code> index","They are discarded","A new index named for the sourcetype"],a:[0],e:"Without <code>index=</code>, events go to the default index (<b>main</b> unless changed). Set <code>index=</code> to route elsewhere.",d:'hard'}],
    [{q:"A heavy forwarder only forwards data. Which license group avoids using Enterprise quota?",o:["Enterprise","Forwarder","Free","Trial"],a:[1],e:"Set a forward-only HF to the <b>Forwarder</b> group so it doesn't count against Enterprise volume."},
     {q:"What is the Free license daily indexing limit?",o:["100 MB/day","500 MB/day","5 GB/day","Unlimited"],a:[1],e:"<b>500 MB/day</b>, and it disables auth, alerting, and distributed search."},
     {q:"Splunk license usage is measured by...",o:["Total data stored on disk","Data indexed per day","Number of searches","Number of forwarders"],a:[1],e:"License is metered on <b>volume indexed per day</b>."}],
    [{q:"You need to route unwanted events to nullQueue BEFORE indexing. Which forwarder can?",o:["Universal forwarder","Heavy forwarder","Neither — only the indexer","Deployment server"],a:[1],e:"A <b>heavy forwarder</b> parses, so it can filter/route before sending. A UF doesn't parse."},
     {q:"Which forwarder is a lightweight agent that forwards mostly unparsed data?",o:["Heavy forwarder","Universal forwarder","Search head","Indexer"],a:[1],e:"The <b>universal forwarder</b> — small footprint, no parsing, no web UI."},
     {q:"On which components does parsing occur?",o:["Universal forwarder only","Heavy forwarder and indexer","Search head only","Deployment server"],a:[1],e:"Parsing happens on the <b>heavy forwarder</b> and the <b>indexer</b>, never a UF."}],
    [{q:"Which bucket state is the only one being actively written to?",o:["warm","hot","cold","frozen"],a:[1],e:"Only <b>hot</b> buckets are writable; warm/cold are read-only searchable; frozen leaves the index."},
     {q:"By default, what happens when a bucket rolls to frozen?",o:["Compressed and kept forever","Deleted (unless coldToFrozenDir is set)","Moved back to hot","Re-indexed"],a:[1],e:"Frozen data is <b>deleted by default</b>; set <code>coldToFrozenDir</code> to archive."},
     {q:"Which indexes.conf setting freezes data by AGE?",o:["maxTotalDataSizeMB","frozenTimePeriodInSecs","homePath","maxHotBuckets"],a:[1],e:"<code>frozenTimePeriodInSecs</code> freezes by age; <code>maxTotalDataSizeMB</code> by size."}],
    [{q:"Which config makes a forwarder poll a deployment server?",o:["serverclass.conf","deploymentclient.conf","outputs.conf","web.conf"],a:[1],e:"<code>deploymentclient.conf</code> (via <code>splunk set deploy-poll</code>) points a client at its server."},
     {q:"On a deployment server, what groups clients and maps them to apps?",o:["A server class","An index","A search head cluster","A license pool"],a:[0],e:"A <b>server class</b> (serverclass.conf) associates client groups with deployment apps."},
     {q:"Where do deployable apps live on the deployment server?",o:["etc/apps","etc/deployment-apps","var/run","etc/system/local"],a:[1],e:"Staged apps go in <code>$SPLUNK_HOME/etc/deployment-apps</code>."}],
    [{q:"Best practice: where should most field extractions be done?",o:["Index time","Search time","On the universal forwarder","In the license manager"],a:[1],e:"Prefer <b>search-time</b> — flexible and changeable without re-indexing."},
     {q:"Which of these is an INDEX-time field?",o:["A field alias","A lookup output field","sourcetype","A calculated (eval) field"],a:[2],e:"<b>sourcetype</b> (like host, source, _time) is index-time. Aliases, lookups, calculated fields are search-time."},
     {q:"To change a field extraction WITHOUT re-indexing, it must be...",o:["Index-time","Search-time","Done on the forwarder","Stored in the fishbucket"],a:[1],e:"Only <b>search-time</b> extractions can be changed retroactively."}],
    [{q:"Which configuration file defines <b>where</b> a forwarder sends its data?",o:["inputs.conf","outputs.conf","props.conf","indexes.conf"],a:[1],e:"<b>outputs.conf</b> sets the destination indexers (port 9997). inputs.conf defines what to collect."},
     {q:"Line breaking and timestamp recognition for a sourcetype are configured in...",o:["transforms.conf","props.conf","indexes.conf","server.conf"],a:[1],e:"<b>props.conf</b> controls per-sourcetype parsing (LINE_BREAKER, TIME_FORMAT) and references transforms.conf for route/mask rules."},
     {q:"Which file holds the regex rule that routes matching events to the nullQueue?",o:["props.conf","transforms.conf","authorize.conf","limits.conf"],a:[1],e:"<b>transforms.conf</b> defines the rule (REGEX, DEST_KEY=queue, FORMAT=nullQueue); props.conf references it with TRANSFORMS-."},
     {q:"Roles and the capabilities assigned to them are defined in...",o:["authentication.conf","authorize.conf","server.conf","web.conf"],a:[1],e:"<b>authorize.conf</b> defines roles and capabilities. authentication.conf handles the auth method (LDAP/SAML) and mapping users to roles."},
     {q:"Index storage paths and retention live in which file?",o:["indexes.conf","inputs.conf","props.conf","limits.conf"],a:[0],e:"<b>indexes.conf</b> defines each index, its paths, and retention (frozenTimePeriodInSecs, maxTotalDataSizeMB)."},
     {q:"Which file makes a forwarder poll a deployment server for apps?",o:["serverclass.conf","deploymentclient.conf","outputs.conf","server.conf"],a:[1],e:"<b>deploymentclient.conf</b> points the client at its server. serverclass.conf lives on the SERVER and groups clients."},
     {q:"The default 10,000-result subsearch cap and other search limits are set in...",o:["limits.conf","props.conf","web.conf","server.conf"],a:[0],e:"<b>limits.conf</b> controls search and resource limits."}],
  ];
  const CONFDEFS=[
    {icon:'📤',title:'outputs.conf',tag:'core',why:`It is the twin of inputs.conf and it is easy to forget which one sends vs collects.`,
     body:`<p><b>outputs.conf</b> lives <b>on a forwarder</b> and defines <b>where</b> data is sent — the receiving indexers.</p>
     <ul><li><code>[tcpout]</code> with <code>defaultGroup</code> — the default target group</li><li><code>[tcpout:&lt;group&gt;]</code> with <code>server = idx1:9997, idx2:9997</code> — the indexers (multiple = load balancing)</li><li><code>[indexAndForward]</code> — also index locally while forwarding</li></ul>`,
     example:`[tcpout]\ndefaultGroup = my_indexers\n\n[tcpout:my_indexers]\nserver = idx1:9997, idx2:9997`,
     gotcha:`outputs.conf is on the <b>sender</b> (forwarder). The receiver (indexer) listens via <b>inputs.conf</b> <code>[splunktcp://9997]</code>.`,doc:D+'Admin/Outputsconf',
     quiz:[
      {q:"On a forwarder, which file defines <b>where</b> data is sent?",o:["inputs.conf","outputs.conf","props.conf","indexes.conf"],a:[1],e:"<b>outputs.conf</b> sets the destination indexers; inputs.conf defines what to collect."},
      {q:"Which default port appears in outputs.conf <code>server</code> settings?",o:["8000","8089","9997","8088"],a:[2],e:"<b>9997</b> is the default receiving port on the indexers."},
      {q:"You set <code>server = idxA:9997, idxB:9997</code>. What does listing multiple indexers do?",o:["Failover only","Automatic load balancing across them","Replicates buckets","Nothing"],a:[1],e:"Multiple servers = <b>automatic load balancing</b> across those indexers.",d:'med'},
      {q:"Which stanza defines the default target group forwarders send to?",o:["<code>[tcpout]</code> with <code>defaultGroup</code>","<code>[tcpout-server]</code>","<code>[indexAndForward]</code>","<code>[target-broker]</code>"],a:[0],e:"<code>[tcpout]</code> with <code>defaultGroup=</code> names the default destination group.",d:'med'},
      {q:"Which outputs.conf stanza lets an instance <b>index locally in addition to forwarding</b>?",o:["<code>[tcpout]</code>","<code>[indexAndForward]</code>","<code>[syslog]</code>","<code>[httpout]</code>"],a:[1],e:"<code>[indexAndForward]</code> keeps a local indexed copy; normally forwarders don't index.",d:'hard'},
      {q:"Which statement about outputs.conf is TRUE?",o:["It lives on the indexer to receive data","It lives on the forwarder and defines destinations + load balancing","It defines index retention","It maps deployment clients to apps"],a:[1],e:"outputs.conf is on the <b>forwarder</b> (sender). The indexer's receiving side is inputs.conf <code>[splunktcp://9997]</code>.",d:'hard'}]},
    {icon:'🧩',title:'props.conf',tag:'heavy',why:`It is the parsing brain, it references transforms, and it carries the source&gt;host&gt;sourcetype precedence — the single most-tested config file.`,
     body:`<p><b>props.conf</b> sets parsing <b>per source / host / sourcetype</b>: line breaking (<code>LINE_BREAKER</code>, <code>SHOULD_LINEMERGE</code>), timestamps (<code>TIME_PREFIX</code>, <code>TIME_FORMAT</code>, <code>MAX_TIMESTAMP_LOOKAHEAD</code>, <code>TZ</code>), encoding (<code>CHARSET</code>), truncation (<code>TRUNCATE</code>), masking (<code>SEDCMD</code>).</p>
     <p>It also <b>references transforms.conf</b>: <code>TRANSFORMS-</code> (index-time), <code>REPORT-</code> (search-time), plus <code>EXTRACT-</code> (inline) and <code>LOOKUP-</code>.</p>`,
     example:`[my_sourcetype]\nCHARSET = UTF-8\nSHOULD_LINEMERGE = false\nTIME_PREFIX = ts=\nTRANSFORMS-drop = drop_debug`,
     gotcha:`Stanza precedence is <b>source &gt; host &gt; sourcetype</b>. props does the parsing; transforms holds the regex action it calls.`,doc:D+'Admin/Propsconf',
     quiz:[
      {q:"Which file controls line breaking, timestamp extraction, and <code>CHARSET</code>?",o:["transforms.conf","props.conf","inputs.conf","limits.conf"],a:[1],e:"<b>props.conf</b> owns per-sourcetype parsing settings."},
      {q:"props.conf settings are applied per...",o:["index","source / host / sourcetype","user","role"],a:[1],e:"props applies by <b>source, host, or sourcetype</b>."},
      {q:"The same attribute is set under <code>[source::...]</code>, <code>[host::...]</code>, and <code>[sourcetype]</code>. Which wins?",o:["sourcetype","host","source","They merge equally"],a:[2],e:"Precedence is <b>source &gt; host &gt; sourcetype</b>.",d:'med'},
      {q:"Which props attribute invokes an <b>index-time</b> transform (e.g. nullQueue routing)?",o:["<code>REPORT-</code>","<code>TRANSFORMS-</code>","<code>EXTRACT-</code>","<code>LOOKUP-</code>"],a:[1],e:"<code>TRANSFORMS-</code> = index-time; <code>REPORT-</code> = search-time.",d:'med'},
      {q:"A <b>search-time</b> field extraction that references a transforms.conf stanza uses which attribute?",o:["<code>TRANSFORMS-</code>","<code>REPORT-</code>","<code>EXTRACT-</code>","<code>SEDCMD</code>"],a:[1],e:"<code>REPORT-</code> references a transforms stanza at search time; <code>EXTRACT-</code> is inline; <code>TRANSFORMS-</code> is index-time.",d:'hard'},
      {q:"Which setting is NOT configured in props.conf?",o:["<code>LINE_BREAKER</code>","<code>TIME_FORMAT</code>","<code>CHARSET</code>","<code>server = idx:9997</code>"],a:[3],e:"<code>server = idx:9997</code> belongs in <b>outputs.conf</b>, not props.",d:'hard'}]},
    {icon:'🔁',title:'transforms.conf',tag:'heavy',why:`It only acts when props.conf calls it, and the nullQueue recipe trips people up.`,
     body:`<p><b>transforms.conf</b> holds the named <b>rules</b> props.conf references: routing/filtering (<code>DEST_KEY = queue</code>, <code>FORMAT = nullQueue</code>), index-time field writes (<code>WRITE_META</code>), field-extraction definitions used by <code>REPORT-</code>, lookup definitions, and host/source/sourcetype overrides.</p>`,
     example:`[drop_debug]\nREGEX = DEBUG\nDEST_KEY = queue\nFORMAT = nullQueue`,
     gotcha:`A transform does nothing until <b>props.conf references it</b> (e.g. <code>TRANSFORMS-drop = drop_debug</code>).`,doc:D+'Admin/Transformsconf',
     quiz:[
      {q:"The regex rule that props.conf references (routing, extraction, masking) lives in?",o:["props.conf","transforms.conf","indexes.conf","inputs.conf"],a:[1],e:"<b>transforms.conf</b> holds the named rules."},
      {q:"To drop events to the nullQueue, the transform sets <code>DEST_KEY = queue</code> and <code>FORMAT =</code>?",o:["indexQueue","nullQueue","parsingQueue","typingQueue"],a:[1],e:"<code>FORMAT = nullQueue</code> discards the event before indexing."},
      {q:"A transform alone drops nothing until...",o:["You restart twice","props.conf references it with <code>TRANSFORMS-</code>","You run <code>| delete</code>","You enable HEC"],a:[1],e:"props.conf must invoke it via <code>TRANSFORMS-&lt;class&gt;</code>.",d:'med'},
      {q:"In the keep-only pattern, the transform that rescues matching events routes them with <code>FORMAT =</code>?",o:["nullQueue","indexQueue","keepQueue","mainQueue"],a:[1],e:"<code>indexQueue</code> sends the rescued events on to indexing.",d:'med'},
      {q:"Which transforms.conf use case is <b>index-time</b> (not search-time)?",o:["An automatic lookup definition","nullQueue routing","A <code>REPORT-</code> field extraction","A field alias"],a:[1],e:"nullQueue routing is index-time; lookups, REPORT- extractions, and aliases are search-time.",d:'hard'},
      {q:"Which correctly filters unwanted DEBUG events?",o:["A props <code>SEDCMD</code> only","transforms <code>REGEX=DEBUG DEST_KEY=queue FORMAT=nullQueue</code> + props <code>TRANSFORMS-</code>","<code>| delete DEBUG</code>","inputs.conf <code>blacklist=DEBUG</code>"],a:[1],e:"Index-time filtering needs the transform rule AND a props <code>TRANSFORMS-</code> reference.",d:'hard'}]},
    {icon:'🗄️',title:'indexes.conf',tag:'core',why:`It defines indexes and drives the hot/warm/cold/frozen retention that the exam pokes at.`,
     body:`<p><b>indexes.conf</b> defines each <b>index</b>, its storage paths (<code>homePath</code>, <code>coldPath</code>, <code>thawedPath</code>), and retention: <code>frozenTimePeriodInSecs</code> (age), <code>maxTotalDataSizeMB</code> (size), <code>coldToFrozenDir</code> (archive). Set <code>datatype = metric</code> for a metrics index; <code>repFactor</code> for clustering.</p>`,
     example:`[web]\nhomePath = $SPLUNK_DB/web/db\ncoldPath = $SPLUNK_DB/web/colddb\nfrozenTimePeriodInSecs = 7776000`,
     gotcha:`Freezing triggers on <b>age OR size, whichever is hit first</b>. Frozen = deleted by default unless <code>coldToFrozenDir</code> is set.`,doc:D+'Admin/Indexesconf',
     quiz:[
      {q:"Which file defines indexes, their paths, and retention?",o:["inputs.conf","indexes.conf","server.conf","limits.conf"],a:[1],e:"<b>indexes.conf</b>."},
      {q:"Which setting freezes buckets by <b>age</b>?",o:["maxTotalDataSizeMB","frozenTimePeriodInSecs","homePath","repFactor"],a:[1],e:"<code>frozenTimePeriodInSecs</code> freezes by age."},
      {q:"By default, when a bucket freezes it is...",o:["Archived forever","Deleted, unless <code>coldToFrozenDir</code> is set","Moved back to hot","Compressed and kept"],a:[1],e:"Frozen = <b>deleted by default</b>; set <code>coldToFrozenDir</code> to archive.",d:'med'},
      {q:"<code>maxTotalDataSizeMB</code> controls freezing by...",o:["Age","Total index size","Number of searches","License"],a:[1],e:"It freezes oldest buckets once the index exceeds that size.",d:'med'},
      {q:"Both <code>frozenTimePeriodInSecs</code> and <code>maxTotalDataSizeMB</code> are set. Which triggers freezing?",o:["Only age","Only size","Whichever limit is reached first","Neither"],a:[2],e:"<b>Whichever is hit first</b> rolls the bucket to frozen.",d:'hard'},
      {q:"To create a <b>metrics</b> index rather than an events index, set...",o:["<code>datatype = metric</code>","<code>indextype = metric</code>","<code>metric = true</code>","<code>kind = metric</code>"],a:[0],e:"<code>datatype = metric</code> makes it a metrics index.",d:'hard'}]},
    {icon:'🖥️',title:'server.conf',tag:'admin',why:`It is the catch-all for instance identity and clustering, so it hides a lot of admin settings.`,
     body:`<p><b>server.conf</b> holds general server settings: <code>serverName</code>, the <code>[general]</code> stanza, <b>indexer clustering</b> (<code>[clustering]</code> mode = manager/peer/searchhead), search head clustering, KV store, and the shared secret <code>pass4SymmKey</code>.</p>`,
     example:`[general]\nserverName = splunk-idx-01\n\n[clustering]\nmode = manager\nreplication_factor = 3`,
     gotcha:`Changing <code>serverName</code> or clustering settings requires a <b>restart</b>. Parsing settings (LINE_BREAKER etc.) are NOT here — those are props.conf.`,doc:D+'Admin/Serverconf',
     quiz:[
      {q:"<code>serverName</code> and general server settings live in?",o:["web.conf","server.conf","inputs.conf","authorize.conf"],a:[1],e:"<b>server.conf</b>."},
      {q:"After changing <code>serverName</code>, what is required?",o:["Nothing","A restart","Re-index all data","A new license"],a:[1],e:"Server-identity changes need a <b>restart</b>."},
      {q:"Indexer clustering mode (manager/peer/searchhead) is set in which file's <code>[clustering]</code> stanza?",o:["indexes.conf","server.conf","outputs.conf","serverclass.conf"],a:[1],e:"<code>[clustering]</code> lives in <b>server.conf</b>.",d:'med'},
      {q:"The shared secret cluster/SHC members use to authenticate is...",o:["<code>pass4SymmKey</code> in server.conf","<code>adminPassword</code>","<code>sslPassword</code>","an HEC token"],a:[0],e:"<code>pass4SymmKey</code> in server.conf is the shared secret.",d:'med'},
      {q:"Which of these is NOT set in server.conf?",o:["Clustering mode","serverName","KV store settings","LINE_BREAKER"],a:[3],e:"<code>LINE_BREAKER</code> is a props.conf parsing setting.",d:'hard'},
      {q:"Running <code>splunk edit cluster-config -mode manager ...</code> writes which file?",o:["indexes.conf","server.conf","outputs.conf","deploymentclient.conf"],a:[1],e:"Cluster config is stored in <b>server.conf</b>.",d:'hard'}]},
    {icon:'📡',title:'deploymentclient.conf',tag:'admin',why:`It is constantly confused with serverclass.conf — same topic, opposite side.`,
     body:`<p><b>deploymentclient.conf</b> lives <b>on the deployment client</b> (a forwarder) and makes it <b>poll a deployment server</b> for apps. Set with <code>splunk set deploy-poll &lt;mgr&gt;:8089</code>.</p>`,
     example:`[deployment-client]\n\n[target-broker:deploymentServer]\ntargetUri = deploy-mgr:8089`,
     gotcha:`<b>deploymentclient.conf = on the client (forwarder). serverclass.conf = on the server.</b> Opposite sides of the same relationship.`,doc:D+'Admin/Deploymentclientconf',
     quiz:[
      {q:"Which file makes a forwarder poll a deployment server?",o:["serverclass.conf","deploymentclient.conf","outputs.conf","server.conf"],a:[1],e:"<b>deploymentclient.conf</b>."},
      {q:"deploymentclient.conf lives on the...",o:["Deployment server","Deployment client (forwarder)","Cluster manager","SHC captain"],a:[1],e:"It lives on the <b>client</b> being managed."},
      {q:"Which CLI command writes deploymentclient.conf?",o:["<code>splunk set deploy-poll mgr:8089</code>","<code>splunk enable listen</code>","<code>splunk add forward-server</code>","<code>splunk apply cluster-bundle</code>"],a:[0],e:"<code>splunk set deploy-poll</code> points the client at its server.",d:'med'},
      {q:"The <code>targetUri</code> points at the deployment server on which port?",o:["9997","8000","8089","8088"],a:[2],e:"The management port <b>8089</b>.",d:'med'},
      {q:"Which is TRUE about deploymentclient.conf vs serverclass.conf?",o:["Both live on the server","deploymentclient on the client, serverclass on the server","Both live on the client","Both live on the indexer"],a:[1],e:"Client-side vs server-side of the same deployment relationship.",d:'hard'},
      {q:"A forwarder is not pulling apps. Which is a valid cause?",o:["deploymentclient.conf <code>targetUri</code> is wrong/missing on the client","indexes.conf is misconfigured","props precedence","Wrong CHARSET"],a:[0],e:"A bad/missing <code>targetUri</code> stops the client from reaching its deployment server.",d:'hard'}]},
    {icon:'🗂️',title:'serverclass.conf',tag:'admin',why:`It is the server-side twin of deploymentclient.conf and defines who gets which apps.`,
     body:`<p><b>serverclass.conf</b> lives <b>on the deployment server</b>. A <b>server class</b> groups deployment clients (via <code>whitelist</code>/<code>blacklist</code> on clientName, host, IP, DNS) and maps them to <b>deployment apps</b>.</p>`,
     example:`[serverClass:linux_fwd]\nwhitelist.0 = *linux*\n\n[serverClass:linux_fwd:app:Splunk_TA_nix]\nrestartSplunkd = true`,
     gotcha:`Lives on the <b>server</b> (not the forwarder). After edits, run <code>splunk reload deploy-server</code>.`,doc:D+'Admin/Serverclassconf',
     quiz:[
      {q:"On a deployment server, what groups clients and maps them to apps?",o:["A server class","An index","A search head cluster","A license pool"],a:[0],e:"A <b>server class</b>."},
      {q:"serverclass.conf lives on the...",o:["Forwarder","Deployment server","Indexer","Search head"],a:[1],e:"On the <b>deployment server</b>."},
      {q:"Clients are matched into a server class using...",o:["whitelist/blacklist filters (clientName/host/IP/DNS)","Index name","Sourcetype","Role"],a:[0],e:"<b>whitelist/blacklist</b> filters select the clients.",d:'med'},
      {q:"Which stanza maps an app to a server class?",o:["<code>[serverClass:NAME:app:APP]</code>","<code>[app:APP]</code>","<code>[deployment:APP]</code>","<code>[tcpout:APP]</code>"],a:[0],e:"<code>[serverClass:&lt;class&gt;:app:&lt;app&gt;]</code> assigns the app.",d:'med'},
      {q:"To force clients to restart after receiving an app, set...",o:["<code>restartSplunkd = true</code>","<code>reload = true</code>","<code>restart = 1</code>","<code>disabled = false</code>"],a:[0],e:"<code>restartSplunkd = true</code> in the app stanza.",d:'hard'},
      {q:"After editing serverclass.conf, which command makes the server re-read it?",o:["<code>splunk reload deploy-server</code>","<code>splunk apply cluster-bundle</code>","<code>splunk restart forwarder</code>","<code>splunk enable listen</code>"],a:[0],e:"<code>splunk reload deploy-server</code> re-reads apps and classes.",d:'hard'}]},
    {icon:'🔑',title:'authentication.conf',tag:'admin',why:`It handles WHO you are and maps groups to roles — routinely confused with authorize.conf.`,
     body:`<p><b>authentication.conf</b> sets the <b>authentication method</b> — <code>authType = Splunk | LDAP | SAML</code> — plus LDAP/SAML connection details and the <b>group-to-role mapping</b> (roleMap).</p>`,
     example:`[authentication]\nauthType = SAML\n\n[roleMap_SAML]\nadmin = SplunkAdmins`,
     gotcha:`<b>authentication = who you are; authorization (authorize.conf) = what you can do.</b> Role powers live in authorize.conf, not here.`,doc:D+'Admin/Authenticationconf',
     quiz:[
      {q:"Which file sets the authentication method (Splunk/LDAP/SAML)?",o:["authorize.conf","authentication.conf","server.conf","web.conf"],a:[1],e:"<b>authentication.conf</b>."},
      {q:"Mapping external directory <b>groups</b> to Splunk <b>roles</b> is done in...",o:["authentication.conf","indexes.conf","props.conf","limits.conf"],a:[0],e:"The roleMap in <b>authentication.conf</b>."},
      {q:"Which <code>authType</code> is used for SSO?",o:["Splunk","LDAP","SAML","Local"],a:[2],e:"<b>SAML</b> provides single sign-on.",d:'med'},
      {q:"authentication.conf answers which question?",o:["What can you do","Who are you","Which index","How long a search runs"],a:[1],e:"Authentication = <b>who you are</b>; authorization = what you can do.",d:'med'},
      {q:"A user authenticates via LDAP but has no permissions. Where are the role's capabilities/index access actually defined?",o:["authentication.conf","authorize.conf","server.conf","web.conf"],a:[1],e:"Authentication maps the user to a role; the role's powers live in <b>authorize.conf</b>.",d:'hard'},
      {q:"Which setting is NOT in authentication.conf?",o:["LDAP bind DN","SAML idpSSOUrl","roleMap","srchIndexesAllowed"],a:[3],e:"<code>srchIndexesAllowed</code> belongs to a role in <b>authorize.conf</b>.",d:'hard'}]},
    {icon:'🛡️',title:'authorize.conf',tag:'admin',why:`It defines WHAT a role can do and see — the other half of the auth pair.`,
     body:`<p><b>authorize.conf</b> defines <b>roles</b> and their <b>capabilities</b>, plus data access: <code>srchIndexesAllowed</code> (which indexes), <code>srchFilter</code> (restrict within an index), <code>importRoles</code> (inherit), and quotas like <code>srchJobsQuota</code>.</p>`,
     example:`[role_analyst]\nimportRoles = user\nsrchIndexesAllowed = web;security\nsrchFilter = source::*prod*`,
     gotcha:`<code>srchIndexesAllowed</code> = which indexes (index-level). <code>srchFilter</code> = restrict to matching events <b>within</b> an index (needs a distinguishing field).`,doc:D+'Admin/Authorizeconf',
     quiz:[
      {q:"Roles and the capabilities assigned to them live in?",o:["authentication.conf","authorize.conf","server.conf","props.conf"],a:[1],e:"<b>authorize.conf</b>."},
      {q:"A role is built from...",o:["Capabilities","Indexes","Sourcetypes","Tokens"],a:[0],e:"Roles are collections of <b>capabilities</b>."},
      {q:"Which setting limits which <b>indexes</b> a role can search?",o:["srchFilter","srchIndexesAllowed","importRoles","srchJobsQuota"],a:[1],e:"<code>srchIndexesAllowed</code> controls index access.",d:'med'},
      {q:"To restrict a role to only events matching a condition <b>within</b> an index, use...",o:["srchIndexesAllowed","srchFilter","blacklist","TRANSFORMS-"],a:[1],e:"<code>srchFilter</code> filters within an index.",d:'med'},
      {q:"A role should inherit another role's capabilities. Which setting?",o:["importRoles","cloneRole","extendRole","srchFilter"],a:[0],e:"<code>importRoles</code> inherits capabilities from another role.",d:'hard'},
      {q:"You want per-group data separation within a <b>shared</b> index (given a field that identifies the owner). Which authorize.conf mechanism enables it?",o:["srchIndexesAllowed","srchFilter","srchJobsQuota","importRoles"],a:[1],e:"<code>srchFilter</code> restricts within an index by a field; srchIndexesAllowed is index-level only.",d:'hard'}]},
    {icon:'🚦',title:'limits.conf',tag:'core',why:`It quietly caps searches — the classic subsearch 10,000-result limit lives here.`,
     body:`<p><b>limits.conf</b> sets search and resource limits: the <b>subsearch</b> caps (<code>maxout</code> = 10,000 results, plus a ~60s time limit), result-row limits, and concurrency. Raising them can strain memory/CPU.</p>`,
     example:`[subsearch]\nmaxout = 10000\nmaxtime = 60`,
     gotcha:`Subsearch defaults: <b>10,000 results</b> and <b>~60 seconds</b>, after which it is silently finalized (partial results).`,doc:D+'Admin/Limitsconf',
     quiz:[
      {q:"Search and resource limits (like the subsearch cap) live in?",o:["props.conf","limits.conf","server.conf","web.conf"],a:[1],e:"<b>limits.conf</b>."},
      {q:"The default maximum number of results a subsearch returns is...",o:["1000","10000","50000","Unlimited"],a:[1],e:"<b>10,000</b> results by default."},
      {q:"The default subsearch time limit before it is finalized is about...",o:["30 seconds","60 seconds","120 seconds","No limit"],a:[1],e:"About <b>60 seconds</b>.",d:'med'},
      {q:"A subsearch silently returned incomplete results. The likely cause tuned in limits.conf is...",o:["The subsearch maxout/maxtime caps","CHARSET","repFactor","srchFilter"],a:[0],e:"Hitting <code>maxout</code>/<code>maxtime</code> finalizes the subsearch early.",d:'hard'},
      {q:"Which stanza controls the subsearch result cap?",o:["<code>[search]</code>","<code>[subsearch]</code>","<code>[searchresults]</code>","<code>[join]</code>"],a:[1],e:"<code>[subsearch]</code> <code>maxout</code> sets the cap.",d:'hard'},
      {q:"Raising limits.conf caps globally can...",o:["Have no effect","Risk memory/CPU exhaustion and slow the deployment","Reduce license usage","Delete data"],a:[1],e:"Higher caps consume more resources and can degrade performance.",d:'hard'}]},
    {icon:'🌐',title:'web.conf',tag:'admin',why:`It governs the Splunk Web UI — and its port (8000) is a favorite mix-up with the management port (8089).`,
     body:`<p><b>web.conf</b> configures <b>Splunk Web</b> (the UI): <code>httpport</code> (default <b>8000</b>), <code>enableSplunkWebSSL</code> (HTTPS for the UI), <code>startwebserver</code>, and <code>mgmtHostPort</code>.</p>`,
     example:`[settings]\nhttpport = 8000\nenableSplunkWebSSL = true`,
     gotcha:`Web UI port = <b>8000</b> (web.conf); management/REST port = <b>8089</b>. Don't confuse them.`,doc:D+'Admin/Webconf',
     quiz:[
      {q:"Splunk Web (the UI) settings like its port live in?",o:["server.conf","web.conf","inputs.conf","authorize.conf"],a:[1],e:"<b>web.conf</b>."},
      {q:"The default Splunk Web port is...",o:["8089","8000","9997","8088"],a:[1],e:"<b>8000</b> is the default web UI port."},
      {q:"To enable HTTPS for Splunk Web you set...",o:["<code>enableSplunkWebSSL = true</code>","<code>sslWeb = 1</code>","<code>https = on</code>","<code>forceSSL</code>"],a:[0],e:"<code>enableSplunkWebSSL = true</code> in web.conf.",d:'med'},
      {q:"The web UI runs on 8000. Which port is the <b>management/REST</b> port?",o:["8000","8089","9997","514"],a:[1],e:"<b>8089</b> is the management/REST port.",d:'med'},
      {q:"Which is TRUE about web.conf vs server.conf?",o:["web.conf = UI (8000)/web SSL; server.conf = serverName/clustering/mgmt","Both hold serverName","web.conf holds clustering","They are identical"],a:[0],e:"web.conf = the UI tier; server.conf = server identity and clustering.",d:'hard'},

function conceptQuiz(qs,title,masterKey){
  currentRender=()=>conceptQuiz(qs,title,masterKey); S.onKey=null; try{clearTimer();}catch(e){}
  let qi=0,score=0;
  function q(){
    const cur=qs[qi],multi=cur.a.length>1;
    const opts=cur.o.map((o,i)=>`<label class="opt" data-i="${i}"><input type="${multi?'checkbox':'radio'}" name="o" value="${i}"><span>${o}</span><span class="kbd">${i+1}</span></label>`).join('');
    const v=$(`<div class="view">${topBar()}<button class="back" id="cqb">← Concepts</button>
      <div class="glass qcard"><div class="qcat">🎯 ${title} · ${qi+1} / ${qs.length}${cur.d==='hard'?' · <span style="color:var(--accent)">🔥 Harder</span>':cur.d==='med'?' · ◆ Medium':''}</div>
        <p class="qtext">${cur.q}</p>${multi?`<p class="multi">✔ Select all that apply</p>`:''}
        <div class="opts" id="opts">${opts}</div><div id="ex"></div>
        <div class="qnav"><button id="submit">Submit answer</button><button id="next" class="ghost" style="display:none">${qi===qs.length-1?'See score →':'Next question →'}</button></div>
      </div></div>`);
    wireTop(v);
    v.querySelector('#cqb').onclick=conceptsScreen;
    v.querySelectorAll('#opts .opt').forEach(o=>o.onclick=(e)=>{if(e.target.tagName==='INPUT')return;const inp=o.querySelector('input');if(multi)inp.checked=!inp.checked;else{v.querySelectorAll('#opts input').forEach(x=>x.checked=false);inp.checked=true;}});
    let answered=false;
    const grade=()=>{if(answered)return;const picked=[...v.querySelectorAll('#opts input:checked')].map(x=>+x.value);if(!picked.length)return;answered=true;
      const ok=cur.a.slice().sort().join(',')===picked.slice().sort().join(',');if(ok)score++;
      v.querySelectorAll('#opts .opt').forEach(o=>{const i=+o.dataset.i;o.classList.add('disabled');o.querySelector('input').disabled=true;if(cur.a.includes(i))o.classList.add('correct');else if(picked.includes(i))o.classList.add('wrong');});
      v.querySelector('#ex').innerHTML=`<div class="glass explain"><div class="v">${ok?'✓ Correct':'✗ Not quite'}</div>${cur.e}</div>`;
      v.querySelector('#submit').style.display='none';const nx=v.querySelector('#next');nx.style.display='inline-block';nx.focus();};
    v.querySelector('#submit').onclick=grade;
    v.querySelector('#next').onclick=()=>{if(qi<qs.length-1){qi++;q();}else scoreScreen();};
    S.onKey=(e)=>{if(e.key>='1'&&e.key<=String(cur.o.length)){const i=+e.key-1;const inp=v.querySelector(`.opt[data-i="${i}"] input`);if(inp&&!inp.disabled){if(multi)inp.checked=!inp.checked;else{v.querySelectorAll('#opts input').forEach(x=>x.checked=false);inp.checked=true;}}e.preventDefault();}else if(e.key==='Enter'){if(!answered)grade();else v.querySelector('#next').click();e.preventDefault();}};
    show(v);
  }
  function scoreScreen(){
    const pct=Math.round(score/qs.length*100),win=pct>=80;
    if(win&&masterKey){store.conceptMastery=store.conceptMastery||{};store.conceptMastery[masterKey]=true;saveStore();if(win)try{confetti();}catch(e){}}
    const v=$(`<div class="view">${topBar()}<button class="back" id="cqb2">← Concepts</button>
      <div class="brand" style="margin-bottom:10px"><div class="logo">${win?'🏅':'📗'}</div><h1>${pct}%</h1><p>${title}</p></div>
      <div class="glass" style="padding:20px;text-align:center">
        <div style="font-size:1.15rem;font-weight:850;color:${win?'var(--green)':'var(--amber)'}">${win?'Mastered! 🎉':'Almost — review and retry'}</div>
        <p style="color:var(--muted);margin-top:6px">${score} / ${qs.length} correct</p>
        <div style="display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap"><button id="retry">↻ Retry</button><button id="toc" class="ghost">Back to concepts</button></div>
      </div></div>`);
    wireTop(v);
    v.querySelector('#cqb2').onclick=conceptsScreen;
    v.querySelector('#retry').onclick=()=>{qi=0;score=0;q();};
    v.querySelector('#toc').onclick=conceptsScreen;
    show(v);
  }
  q();
}

function startQuiz(mode,ids,shuffle){
  if(!ids||!ids.length){toast('⚠️','Nothing to quiz here yet.');return;}
  clearTimer();
  clearResume();
  markStudiedToday();
  S.mode=mode; S.order=shuffle?shuffled(ids):ids.slice();
  S.idx=0;S.score=0;S.streak=0;S.best=0;S.xp=0;S.perCat={};S.missed=[];S.answers={};S.flags=new Set();S.graded=new Set();

function clearTimer(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
function startTimer(){clearTimer();S.timer=setInterval(()=>{S.timeLeft--;paintTimer();if(S.timeLeft<=0){clearTimer();finish();}},1000);}

function renderGraded(v,Q,picked,justAnswered,g){

  const sb=v.querySelector('#submit');if(sb)sb.style.display='none';
  const rvb=v.querySelector('#reveal');if(rvb)rvb.style.display='none';
  const nx=v.querySelector('#next');if(nx){nx.style.display='inline-block';if(justAnswered)nx.focus();}
}
function gradeNow(v,Q){
  if(S.answered)return;
  const picked=[...v.querySelectorAll('#opts input:checked')].map(x=>+x.value);
  if(!picked.length)return;
  S.answered=true;
  const already=S.graded.has(Q.id);
  const ok=eq(picked,Q.a); S.answers[Q.id]=picked;
  const g=already?0:tally(Q,picked);
  if(!already)S.graded.add(Q.id);
  beep(ok);saveStore();
  renderGraded(v,Q,picked,true,g);
  const sc=v.querySelector('.chip.streak');if(sc){sc.classList.toggle('on',S.streak>1);sc.innerHTML=`<span class="fi">🔥</span>${S.streak}`;}
  const xc=v.querySelector('.chip.xp');if(xc)xc.innerHTML=`✦ ${S.xp}`;
}
function finish(){
  clearTimer();S.onKey=null;store.resume=null;
  // In exam mode, grade all now from S.answers
  if(S.mode==='exam'){S.score=0;S.streak=0;S.best=0;S.xp=0;S.perCat={};S.missed=[];
    S.order.forEach(id=>{const Q=QUESTIONS[id];tally(Q,S.answers[id]||[]);});}
  const total=S.order.length,pct=total?Math.round(S.score/total*100):0,pass=pct>=75;
  const full=(S.mode==='practice'||S.mode==='exam');
  // persistence
  store.xpTotal+=S.xp;
  if(full){store.attempts++;store.bestScore=Math.max(store.bestScore,pct);if(pass)store.passes++;}
  // perfect category (full exams only)
  let perfectCat=false;if(full)Object.values(S.perCat).forEach(p=>{if(p.t>=3&&p.c===p.t)perfectCat=true;});
  saveStore();
  const session={completed:true,pass,pct,bestStreak:S.best,mode:S.mode,timeLeft:S.timeLeft,full,perfectCat,catsAttempted:Object.keys(S.perCat).length};
  const earned=full?awardBadges(session):[];
  results(pct,pass,total,earned);
}

/* ============ RESULTS ============ */
function results(pct,pass,total,earned){
  currentRender=()=>results(pct,pass,total,[]);
  const r=76,c=2*Math.PI*r;
  const cats=[...CAT_ORDER,...ADMIN_CAT_ORDER].filter(k=>S.perCat[k]).map(k=>{const p=S.perCat[k],acc=Math.round(p.c/p.t*100);const col=acc>=75?'var(--green)':acc>=50?'var(--amber)':'var(--red)';return{k,acc,p,col};});
  const bars=cats.map(x=>`<div class="catrow"><div class="cn">${CATEGORIES[x.k].name}<span>${x.p.c}/${x.p.t} correct</span></div>
    <div class="track"><i data-w="${x.acc}" style="background:${x.col}"></i></div><div class="pct" style="color:${x.col}">${x.acc}%</div></div>`).join('');
  const weak=cats.filter(x=>x.acc<75).sort((a,b)=>a.acc-b.acc);
  const focus=weak.length?weak.map(x=>`<div class="glass focus ${x.acc<50?'strong':''}"><h4>${CATEGORIES[x.k].name} <span class="sc">· ${x.acc}%</span></h4>
    <p>${CATEGORIES[x.k].blurb}</p><p style="margin-top:10px"><a href="${CATEGORIES[x.k].doc}" target="_blank" rel="noopener">📖 Brush up in the Splunk docs →</a></p>
    <button class="drill" data-k="${x.k}">Drill ${byCat[x.k].length} ${CATEGORIES[x.k].name.split(' ')[0]} questions →</button></div>`).join('')
    :`<div class="glass allgood">🎯 No weak areas - every category at 75%+. Nicely done!</div>`;
  const missedSorted=[...S.missed].sort((a,b)=>(b.flag?1:0)-(a.flag?1:0));
  const review=S.missed.length?`<div class="section-title">Review · ${S.missed.length} missed${S.flags.size?` · ${[...S.flags].length} flagged`:''}</div>`+
    missedSorted.map(m=>`<div class="rev ${m.flag?'flag':''}"><div class="q">${m.flag?'⚑ ':''}${m.q}</div>${m.yours!==undefined?`<div class="a" style="color:var(--red)">✗ Your answer: ${m.yours}</div>`:''}<div class="a" style="color:var(--green)">✓ Correct: ${m.a}</div><div style="color:var(--muted);margin-top:4px">${m.e}</div><div class="doclink">📖 <a href="${m.doc}" target="_blank" rel="noopener">Docs →</a></div></div>`).join(''):'';
  const modeLabel={practice:'Practice',exam:'Timed Exam',drill:'Category Drill',missed:'Review Missed',challenge:'Challenge Round'}[S.mode]||'Practice';
  const v=$(`<div class="view">${topBar()}
    <div class="glass res"><div class="scorewrap"><svg width="190" height="190">
      <circle cx="95" cy="95" r="${r}" fill="none" stroke="var(--hair)" stroke-width="11"/>
      <circle id="scircle" cx="95" cy="95" r="${r}" fill="none" stroke="${pass?'var(--green)':'var(--red)'}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)"/></svg>
      <div class="num"><span><span id="scoreN" style="color:${pass?'var(--green)':'var(--red)'}">0%</span><small>${modeLabel}</small></span></div></div>
      <div class="pill ${pass?'pass':'fail'}">${pass?'PASS':'BELOW PASSING'}</div>
      <div class="kv"><div><b>${S.score}</b>/${total} correct</div><div>🔥 best <b>${S.best}</b></div><div>✦ <b>${S.xp}</b> XP earned</div></div></div>
    <div class="section-title">Focus areas ${weak.length?`· ${weak.length} to brush up`:''}</div>${focus}
    <div class="section-title">Category breakdown</div><div class="glass" style="padding:20px 18px">${bars||'<span style="color:var(--muted)">No categories</span>'}</div>
    ${review}
    <div class="qnav" style="margin-top:20px"><button id="retake">Retake</button><button id="info" class="ghost">Exam menu</button><button id="home" class="ghost">← All exams</button></div></div>`);
  wireTop(v);
  v.querySelector('#retake').onclick=()=>startQuiz(S.mode, S.mode==='missed'?store.missedIds.filter(id=>QUESTIONS[id]&&QUESTIONS[id].exam===curBank()):S.order.slice(), true);
  v.querySelector('#info').onclick=examInfo;
  v.querySelector('#home').onclick=menu;
  v.querySelectorAll('.drill').forEach(b=>b.onclick=()=>startQuiz('drill',byCat[b.dataset.k].slice(),true));
  show(v);
  requestAnimationFrame(()=>{
    v.querySelector('#scircle').style.strokeDashoffset=c*(1-pct/100);
    v.querySelectorAll('.track>i').forEach(i=>i.style.width=i.dataset.w+'%');
    let n=0;const t=setInterval(()=>{n+=Math.max(1,Math.round(pct/28));if(n>=pct){n=pct;clearInterval(t);}v.querySelector('#scoreN').textContent=n+'%';},26);
    if(pass)confetti();
  });
}
function confetti(){const cols=['#ff6a2b','#ffab3d','#33d17a','#6ab8ff','#a45cf5'];
  for(let i=0;i<90;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2.4+Math.random()*1.8)+'s';d.style.animationDelay=Math.random()*.5+'s';d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);setTimeout(()=>d.remove(),4600);}}

/* ============ FLASHCARDS / DECKS ============ */
/* Command Face-Off quiz: questions generated from the COMMANDS data. */
function buildCommandQuiz(){
  const names=[...new Set(COMMANDS.map(c=>c.name))];
  return shuffled([...COMMANDS.keys()]).map((ci,n)=>{
    const c=COMMANDS[ci];
    if(n%2===0){
      const correct=c.name, opts=shuffled([correct,...shuffled(names.filter(x=>x!==correct)).slice(0,3)]);
      return {stem:`Which command or function <i>${c.use.charAt(0).toLowerCase()+c.use.slice(1)}</i>`, opts, ai:opts.indexOf(correct), ex:c.ex, diff:c.diff, doc:c.d, name:c.name};
    }
    const correct=c.vs, opts=shuffled([correct,...shuffled(names.filter(x=>x!==correct&&x!==c.name)).slice(0,3)]);
    return {stem:`<code>${c.name}</code> is most often compared with — and confused for — which command?`, opts, ai:opts.indexOf(correct), ex:c.ex, diff:c.diff, doc:c.d, name:c.name};
  });
}
function startCommandQuiz(){ clearTimer(); markStudiedToday(); S.cq={qs:buildCommandQuiz(),idx:0,score:0}; commandQ(); }
function commandQ(){
  currentRender=commandQ;
  const cq=S.cq, q=cq.qs[cq.idx];
  const v=$(`<div class="view">${topBar()}<button class="back" id="cqexit">← Exit</button>
    <div class="glass qbar">${ringSVG(cq.idx/cq.qs.length)}<div class="lbl">Command quiz<b>${cq.idx+1} / ${cq.qs.length}</b></div><div class="spacer"></div><div class="chip">✓ ${cq.score}</div></div>
    <div class="glass qcard">
      <div class="qcat">⚔️ Command Face-Off</div>
      <p class="qtext">${q.stem}</p>
      <div class="opts" id="opts">${q.opts.map((o,i)=>`<label class="opt" data-i="${i}"><input type="radio" name="o" value="${i}"><span><code>${o}</code></span><span class="kbd">${i+1}</span></label>`).join('')}</div>
      <div id="ex"></div>
      <div class="qnav"><button id="submit">Submit answer</button><button id="next" class="ghost" style="display:none">${cq.idx===cq.qs.length-1?'See results →':'Next →'}</button></div>
    </div></div>`);
  wireTop(v);
  v.querySelector('#cqexit').onclick=examInfo;
  v.querySelector('#submit').onclick=()=>gradeCommandQ(v,q);
  v.querySelector('#next').onclick=()=>{cq.idx++; cq.idx<cq.qs.length?commandQ():commandDone();};
  S.onKey=(e)=>{
    if(e.key>='1'&&e.key<=String(q.opts.length)){const inp=v.querySelector(`.opt[data-i="${+e.key-1}"] input`);if(inp&&!inp.disabled)inp.checked=true;e.preventDefault();}
    else if(e.key==='Enter'){const sb=v.querySelector('#submit');if(sb.style.display!=='none')sb.click();else v.querySelector('#next').click();e.preventDefault();}
  };
  show(v);
}
function gradeCommandQ(v,q){
  const picked=[...v.querySelectorAll('#opts input:checked')].map(x=>+x.value);
  if(!picked.length)return;
  const ok=picked[0]===q.ai; if(ok)S.cq.score++; beep(ok);
  v.querySelectorAll('#opts .opt').forEach(o=>{const i=+o.dataset.i;o.querySelector('input').disabled=true;o.classList.add('disabled');if(i===q.ai)o.classList.add('correct');else if(picked.includes(i))o.classList.add('wrong');else o.classList.add('dim');});
  v.querySelector('#ex').innerHTML=`<div class="glass explain"><div class="v ${ok?'ok':'no'}">${ok?'✓ Correct':'✕ Incorrect'}</div><p style="margin:.5rem 0"><b>${q.name}</b> — ${q.diff}</p><div style="background:rgba(127,127,127,.12);border:1px solid var(--hair);border-radius:8px;padding:9px 11px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;line-height:1.5;overflow-x:auto;margin:.5rem 0">${q.ex}</div><div class="doclink">📖 <a href="${q.doc}" target="_blank" rel="noopener">Read the official Splunk docs →</a></div></div>`;
  v.querySelector('#submit').style.display='none';
  const nx=v.querySelector('#next');nx.style.display='inline-block';nx.focus();
}
function commandDone(){
  S.onKey=null;
  const cq=S.cq, pct=Math.round(cq.score/cq.qs.length*100), pass=pct>=75;
  const v=$(`<div class="view">${topBar()}<div class="glass res">
    <div style="font-size:3rem">⚔️</div><h2 style="margin:6px 0">Command quiz complete</h2>
    <div class="kv"><div>You scored <b>${cq.score}</b> / ${cq.qs.length} (${pct}%) ${pass?'· nice 🎯':''}</div></div>
    <div class="qnav" style="justify-content:center;margin-top:20px"><button id="again">🔀 Try again</button><button id="back" class="ghost">Back</button></div></div></div>`);
  wireTop(v);
  v.querySelector('#again').onclick=startCommandQuiz;
  v.querySelector('#back').onclick=examInfo;
  show(v);
}
function startDeck(cards, shuffle, title, backFn){
  clearTimer(); markStudiedToday();
  S.deck=cards; S.deckTitle=title||'Flashcards'; S.deckBack=backFn||examInfo;
  S.order=shuffle?shuffled([...cards.keys()]):[...cards.keys()];
  S.idx=0; S.fknown=0; flash();
}
function startReview(cards, shuffle){
  const deck=cards.map(r=>({tag:REVIEW_CATNAME[r.c]||'Rapid Review', front:r.q, back:r.a}));
  startDeck(deck, shuffle, 'Rapid Review', reviewPicker);
}
function flash(){
  currentRender=flash;
  const c=S.deck[S.order[S.idx]];
  const v=$(`<div class="view">${topBar()}
    <div class="glass qbar">${ringSVG(S.idx/S.order.length)}<div class="lbl">${S.deckTitle}<b>${S.idx+1} / ${S.order.length}</b></div><div class="spacer"></div>
      <div class="chip">✓ ${S.fknown} known</div></div>
    <div class="fcstage"><div class="fcard" id="fc">
      <div class="fface front"><div class="tag">${c.tag}</div><div class="ft">${c.front}</div></div>
      <div class="fface back"><div class="tag">Answer</div><div class="ft">${c.back}</div>${c.extra?`<p style="color:var(--muted);font-size:.86rem;margin-top:12px">${c.extra}</p>`:''}${c.doc?`<div class="doclink">📖 <a href="${c.doc}" target="_blank" rel="noopener">Docs →</a></div>`:''}</div>
    </div></div>
    <div class="fhint">Tap the card or press Space to flip</div>
    <div class="qnav" style="margin-top:8px"><button id="know">✓ Got it</button><button id="again" class="ghost">Review again</button><button id="exit" class="ghost">Exit</button></div></div>`);
  wireTop(v);
  const fc=v.querySelector('#fc');let flipped=false;const flip=()=>{flipped=!flipped;fc.classList.toggle('flip',flipped);};
  fc.onclick=flip;
  const nextCard=(known)=>{if(known)S.fknown++;if(S.idx===S.order.length-1){flashDone();}else{S.idx++;flash();}};
  v.querySelector('#know').onclick=()=>nextCard(true);
  v.querySelector('#again').onclick=()=>nextCard(false);
  v.querySelector('#exit').onclick=S.deckBack;
  S.onKey=(e)=>{if(e.key===' '){flip();e.preventDefault();}else if(e.key==='ArrowRight'){nextCard(false);}else if(e.key.toLowerCase()==='k'){nextCard(true);}};
  show(v);
}
function flashDone(){
  S.onKey=null;
  const pct=Math.round(S.fknown/S.order.length*100);
  const v=$(`<div class="view">${topBar()}<div class="glass res">
    <div style="font-size:3rem">🃏</div><h2 style="margin:6px 0">Deck complete</h2>
    <div class="kv"><div>You knew <b>${S.fknown}</b> / ${S.order.length} (${pct}%)</div></div>
    <div class="qnav" style="justify-content:center;margin-top:20px"><button id="again">Shuffle again</button><button id="back" class="ghost">Back</button></div></div></div>`);
  wireTop(v);
  v.querySelector('#again').onclick=()=>startDeck(S.deck,true,S.deckTitle,S.deckBack);
  v.querySelector('#back').onclick=S.deckBack;
  show(v);
}
function reviewPicker(){
  currentRender=reviewPicker;
  const groups=REVIEW_CATS.map(k=>({k,n:REVIEW.filter(r=>r.c===k).length})).filter(g=>g.n);
  const total=REVIEW.length;
  const cards=groups.map(g=>`<div class="glass rcat" data-k="${g.k}"><div class="rcbody"><b>${REVIEW_CATNAME[g.k]}</b><p>${g.n} card${g.n>1?'s':''}</p></div><div class="arr">›</div></div>`).join('');
  const v=$(`<div class="view">${topBar()}
    <button class="back">← Exam menu</button>
    <div class="brand" style="margin-bottom:14px"><div class="logo">📖</div><h1>Rapid Review</h1><p>${total} key facts · flip through by topic</p></div>
    <button class="cta" id="all">🔀 Shuffle all ${total} cards</button>
    <div class="section-title">Or pick a topic</div>
    <div class="rcatgrid">${cards}</div></div>`);
  wireTop(v);
  v.querySelector('.back').onclick=examInfo;
  v.querySelector('#all').onclick=()=>startReview(REVIEW.slice(),true);
  v.querySelectorAll('.rcat').forEach(c=>c.onclick=()=>startReview(REVIEW.filter(r=>r.c===c.dataset.k),true));
  show(v);
}

/* ============ boot ============ */
applyTheme();
menu();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
