<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splunk Certification Trainer</title>
<style>
  :root{
    --bg:#0a0a0c; --bg2:#141417; --card:rgba(44,44,48,.55); --card-solid:#1c1c1e;
    --text:#f5f5f7; --muted:#9a9aa2; --hair:rgba(255,255,255,.1);
    --accent:#ff6a2b; --accent2:#ffab3d; --green:#33d17a; --amber:#ffb020; --red:#ff5a52; --blue:#6ab8ff; --violet:#a45cf5;
    --shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 2px 6px rgba(0,0,0,.14), 0 18px 44px rgba(0,0,0,.34);
    --radius:26px; --radius-sm:16px; --spring:cubic-bezier(.34,1.36,.5,1);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f2f2f7; --bg2:#e8e8ef; --card:rgba(255,255,255,.72); --card-solid:#fff;
      --text:#1d1d1f; --muted:#6e6e73; --hair:rgba(0,0,0,.08);
      --shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 1px 2px rgba(20,30,60,.06), 0 14px 36px rgba(20,30,60,.1); }
  }
  :root[data-theme="dark"]{
    --bg:#0a0a0c; --bg2:#141417; --card:rgba(44,44,48,.55); --card-solid:#1c1c1e;
    --text:#f5f5f7; --muted:#9a9aa2; --hair:rgba(255,255,255,.1);
    --shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 2px 6px rgba(0,0,0,.14), 0 18px 44px rgba(0,0,0,.34);
  }
  :root[data-theme="light"]{
    --bg:#f2f2f7; --bg2:#e8e8ef; --card:rgba(255,255,255,.72); --card-solid:#fff;
    --text:#1d1d1f; --muted:#6e6e73; --hair:rgba(0,0,0,.08);
    --shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 1px 2px rgba(20,30,60,.06), 0 14px 36px rgba(20,30,60,.1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    color:var(--text); line-height:1.5; min-height:100vh; padding:26px 18px 64px; letter-spacing:-.011em;
    background:
      radial-gradient(1000px 560px at 10% -10%, rgba(255,106,43,.10), transparent 58%),
      radial-gradient(820px 540px at 100% 0%, rgba(90,120,255,.075), transparent 52%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    background-attachment:fixed;
  }
  .wrap{max-width:820px;margin:0 auto}
  .view{animation:viewIn .45s cubic-bezier(.22,1,.36,1) both}
  @keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(3deg)}}
  @keyframes confetti{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
  @keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes toastIn{0%{opacity:0;transform:translate(-50%,20px)}12%,88%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-14px)}}
  @keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}

  .topbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
  .iconbtn{background:var(--card);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--hair);color:var(--text);border-radius:12px;padding:8px 12px;font-size:.95rem;cursor:pointer;box-shadow:none;font-weight:600;transition:transform .15s var(--spring),border-color .2s}
  .iconbtn:hover{border-color:var(--accent)}
  .iconbtn:active{transform:scale(.92)}

  .brand{text-align:center;margin-bottom:24px}
  .brand .logo{font-size:2.1rem}
  .brand h1{font-size:1.75rem;font-weight:800;letter-spacing:-.035em;margin:8px 0 3px}
  .brand p{color:var(--muted);margin:0;font-size:.94rem;letter-spacing:-.01em}

  .glass{background:var(--card);backdrop-filter:blur(34px) saturate(185%);-webkit-backdrop-filter:blur(34px) saturate(185%);
    border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow)}

  /* dashboard */
  .dash{padding:18px 20px;margin-bottom:18px}
  .dash .lvlrow{display:flex;align-items:center;gap:14px}
  .dash .lvlbadge{width:52px;height:52px;border-radius:15px;background:linear-gradient(180deg,#ff7a3d,#f0551b);color:#fff;display:grid;place-items:center;font-weight:850;font-size:1.2rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 22px rgba(255,106,43,.3)}
  .dash .lvlmeta{flex:1;min-width:0}
  .dash .lvlmeta .t{font-weight:750;font-size:.98rem}
  .dash .lvlmeta .s{color:var(--muted);font-size:.8rem}
  .xpbar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
  .xpbar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .9s cubic-bezier(.22,1,.36,1)}
  .dstats{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
  .dstat{flex:1;min-width:78px;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:14px;padding:11px 6px}
  .dstat b{display:block;font-size:1.15rem;letter-spacing:-.02em}
  .dstat span{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em}
  .swrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .swtag{flex:1;min-width:150px;border-radius:12px;padding:9px 12px;font-size:.82rem;border:1px solid var(--hair)}
  .swtag.str{background:rgba(51,209,122,.1)} .swtag.weak{background:rgba(255,90,82,.1)}
  .swtag b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:1px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .bdg{font-size:1.15rem;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--hair)}
  .bdg.locked{filter:grayscale(1);opacity:.28}

  /* menu cards */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:620px){.grid{grid-template-columns:1fr}}
  .exam{padding:22px;cursor:pointer;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.22,1,.36,1)}
  .exam.locked{cursor:default;opacity:.72}
  .exam:not(.locked):hover{transform:translateY(-6px)}
  .exam .ico{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:1.6rem;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 22px rgba(0,0,0,.28)}
  .exam h3{margin:0 0 3px;font-size:1.12rem;letter-spacing:-.01em}
  .exam .code{color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.03em}
  .exam .tl{color:var(--muted);font-size:.9rem;margin:10px 0 0}
  .badge{position:absolute;top:18px;right:18px;font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:99px}
  .badge.ready{background:rgba(51,209,122,.16);color:var(--green)}
  .badge.soon{background:rgba(255,255,255,.08);color:var(--muted)}
  .exam.ready{border-color:rgba(255,106,43,.5);box-shadow:0 0 0 1px rgba(255,106,43,.28),var(--shadow)}
  .exam .go{display:inline-block;margin-top:16px;background:linear-gradient(180deg,var(--accent),#f0551b);color:#fff;padding:9px 16px;border-radius:11px;font-weight:800;font-size:.85rem;box-shadow:0 8px 20px rgba(255,106,43,.3)}
  .exam .soonhint{display:inline-block;margin-top:16px;color:var(--muted);font-size:.82rem}
  .exam .official{display:inline-block;margin-top:16px;color:var(--accent);font-weight:700;font-size:.82rem;text-decoration:none}
  .exam .official:hover{text-decoration:underline}
  .exam .due{margin-top:12px;font-size:.76rem;color:var(--amber);font-weight:700}
  .duebadge{display:inline-block;margin-top:12px;background:rgba(255,176,32,.14);color:var(--amber);font-weight:700;font-size:.82rem;padding:7px 13px;border-radius:99px}
  .hero-cta{width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;padding:18px;margin-bottom:16px;font-size:1.1rem}
  .hero-cta small{font-weight:600;opacity:.85;font-size:.8rem}
  .path{margin-top:22px;text-align:center;color:var(--muted);font-size:.82rem}

  button{font:inherit;font-weight:650;letter-spacing:-.012em;border:0;border-radius:14px;padding:15px 26px;cursor:pointer;
    background:linear-gradient(180deg,#ff7a3d,#f0551b);color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 6px 18px rgba(255,106,43,.3);transition:transform .2s var(--spring),box-shadow .2s,opacity .2s,filter .2s}
  button:hover{filter:brightness(1.05)}
  button:active{transform:scale(.96)}
  button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  button.ghost{background:transparent;color:var(--text);border:1.5px solid var(--hair);box-shadow:none}
  button.ghost:hover{border-color:var(--accent);box-shadow:none}
  .back{display:inline-flex;align-items:center;gap:7px;background:none;color:var(--muted);padding:8px 0;box-shadow:none;font-weight:600;margin-bottom:12px}
  .back:hover{color:var(--text);box-shadow:none}

  .hero{padding:30px;margin-bottom:16px;position:relative;overflow:hidden}
  .hero .ico{width:64px;height:64px;border-radius:19px;display:grid;place-items:center;font-size:2rem;margin-bottom:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 26px rgba(0,0,0,.3);animation:floaty 4s ease-in-out infinite}
  .hero h2{margin:0 0 4px;font-size:1.5rem;letter-spacing:-.02em}
  .hero .code{color:var(--muted);font-weight:700;font-size:.85rem}
  .hero p{color:var(--muted);margin:14px 0 0;font-size:.95rem}
  .facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .fact{background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:12px;padding:9px 13px;font-size:.82rem;color:var(--muted)}
  .stats{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
  .stat{flex:1;min-width:100px;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:16px;padding:14px;text-align:center}
  .stat b{display:block;font-size:1.4rem;letter-spacing:-.02em}
  .stat span{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}

  .section-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:22px 6px 12px}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:620px){.modes{grid-template-columns:1fr}}
  .mode{padding:17px;cursor:pointer;display:flex;gap:13px;align-items:flex-start;transition:transform .25s,border-color .2s}
  .mode:hover:not(.dis){transform:translateY(-3px);border-color:var(--accent)}
  .mode.dis{opacity:.45;cursor:not-allowed}
  .mode .mi{font-size:1.4rem;flex-shrink:0}
  .mode b{font-size:.98rem} .mode p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
  .mode .arr{margin-left:auto;align-self:center;color:var(--muted);font-weight:600;font-size:1.5rem;line-height:1;opacity:.5;transition:color .2s,opacity .2s,transform .2s var(--spring)}
  .mode:hover:not(.dis) .arr{color:var(--accent);opacity:1;transform:translateX(3px)}
  .mode.rec{border-color:rgba(255,106,43,.45)}
  .rectag{display:inline-block;margin-left:7px;font-size:.62rem;font-weight:800;letter-spacing:.04em;color:var(--accent);background:rgba(255,106,43,.14);padding:2px 7px;border-radius:99px;vertical-align:middle}
  .seemore{width:100%;margin-top:6px;font-size:.9rem}
  .rcatgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:620px){.rcatgrid{grid-template-columns:1fr}}
  .rcat{padding:16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .25s var(--spring),border-color .2s}
  .rcat:hover{transform:translateY(-3px);border-color:var(--accent)}
  .rcat .rcbody{flex:1;min-width:0}
  .rcat .rcbody b{font-size:.95rem}
  .rcat .rcbody p{margin:2px 0 0;color:var(--muted);font-size:.8rem}
  .rcat .arr{color:var(--muted);font-size:1.4rem;line-height:1;opacity:.5;transition:color .2s,opacity .2s,transform .2s var(--spring)}
  .rcat:hover .arr{color:var(--accent);opacity:1;transform:translateX(3px)}

  .cat{padding:15px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
  .cat .w{flex-shrink:0;width:42px;height:42px;border-radius:12px;background:rgba(255,106,43,.14);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.85rem}
  .cat .body{flex:1;min-width:0}.cat .body b{font-size:.97rem}.cat .body p{margin:2px 0 0;color:var(--muted);font-size:.83rem}
  .cat a{color:var(--accent);text-decoration:none;font-size:.8rem;font-weight:700;white-space:nowrap}.cat a:hover{text-decoration:underline}

  .cta{width:100%;margin-top:6px;padding:17px;font-size:1.05rem}
  .toggle{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--muted);font-size:.9rem;margin:16px 0 8px}
  .toggle input{width:17px;height:17px;accent-color:var(--accent)}
  .lenrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 2px 4px;flex-wrap:wrap}
  .lenlabel{font-weight:650;font-size:.92rem}
  .segmented{display:inline-flex;background:rgba(127,127,127,.14);border:1px solid var(--hair);border-radius:12px;padding:3px;gap:2px}
  .seg{padding:8px 15px;border-radius:9px;font-weight:650;font-size:.86rem;color:var(--muted);cursor:pointer;background:transparent;border:0;box-shadow:none;transition:color .2s,background .2s,transform .12s var(--spring)}
  .seg:hover{color:var(--text)}
  .seg.on{background:var(--card-solid);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
  .seg:active{transform:scale(.94)}

  /* quiz */
  .qbar{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px}
  .ring{width:46px;height:46px;flex-shrink:0}
  .ring circle{fill:none;stroke-width:5}.ring .bgc{stroke:var(--hair)}
  .ring .fg{stroke:url(#grad);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.22,1,.36,1)}
  .qbar .lbl{font-size:.8rem;color:var(--muted);font-weight:600}.qbar .lbl b{color:var(--text);display:block;font-size:.98rem}
  .qbar .spacer{flex:1}
  .chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);border:1px solid var(--hair);border-radius:99px;padding:7px 12px;font-weight:700;font-size:.85rem}
  .chip.streak.on{color:var(--accent2);border-color:rgba(255,171,61,.35)}
  .chip.streak.on .fi{animation:flame .7s ease-in-out infinite;display:inline-block}
  .chip.xp{color:var(--blue)}
  .chip.timer{color:var(--text)} .chip.timer.warn{color:var(--red);border-color:rgba(255,90,82,.4)}
  .flagbtn{background:none;box-shadow:none;border:1px solid var(--hair);border-radius:99px;padding:7px 11px;color:var(--muted);font-size:.85rem}
  .flagbtn.on{color:var(--amber);border-color:rgba(255,176,32,.4)}

  .qcard{padding:26px}
  .qcat{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);margin-bottom:8px}
  .chall{display:inline-block;margin-left:7px;font-size:.62rem;font-weight:800;letter-spacing:.04em;color:var(--violet);background:rgba(164,92,245,.16);padding:2px 8px;border-radius:99px;vertical-align:middle;text-transform:none}
  .qtext{font-size:1.16rem;font-weight:650;letter-spacing:-.01em;margin:0 0 4px}
  .multi{font-size:.8rem;color:var(--muted);margin:6px 0 0}
  code{background:rgba(255,255,255,.09);padding:1.5px 6px;border-radius:6px;font-size:.88em;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
  .opts{display:flex;flex-direction:column;gap:11px;margin:18px 0 0}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:15px 16px;border:1px solid var(--hair);border-radius:14px;cursor:pointer;
    background:rgba(127,127,127,.06);transition:border-color .18s,background .18s,transform .16s var(--spring),box-shadow .2s}
  .opt:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.12)}.opt:active{transform:scale(.985)}
  .opt input{margin-top:2px;accent-color:var(--accent);width:18px;height:18px;flex-shrink:0}
  .opt .kbd{margin-left:auto;font-size:.72rem;color:var(--muted);border:1px solid var(--hair);border-radius:6px;padding:1px 6px;align-self:center}
  .opt.correct{border-color:var(--green);background:rgba(51,209,122,.12);animation:pop .45s}
  .opt.wrong{border-color:var(--red);background:rgba(255,90,82,.12);animation:shake .5s}
  .opt.picked{border-color:var(--accent);background:rgba(255,106,43,.1)}
  .opt.dim{opacity:.5}.opt.disabled{pointer-events:none}
  .explain{margin-top:16px;padding:15px 17px;border-radius:15px;background:rgba(255,255,255,.04);border-left:4px solid var(--accent2);font-size:.92rem;animation:slideDown .35s ease both}
  .explain .v{font-weight:800;margin-bottom:8px;font-size:1rem}.explain .v.ok{color:var(--green)}.explain .v.no{color:var(--red)}
  .explain b{color:var(--accent2)}
  .doclink{margin-top:12px;font-size:.85rem}.doclink a{color:var(--accent);text-decoration:none;font-weight:700}.doclink a:hover{text-decoration:underline}
  .qnav{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
  .plusxp{margin-left:8px;color:var(--green);font-weight:800;font-size:.85rem}

  /* flashcards */
  .fcstage{perspective:1200px;margin:8px 0}
  .fcard{position:relative;min-height:260px;transition:transform .55s cubic-bezier(.22,1,.36,1);transform-style:preserve-3d;cursor:pointer}
  .fcard.flip{transform:rotateY(180deg)}
  .fface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:28px;display:flex;flex-direction:column;justify-content:center;
    background:var(--card-solid);border:1px solid var(--hair);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto}
  .fface .tag{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);margin-bottom:10px}
  .fface .ft{font-size:1.15rem;font-weight:650}
  .fface.back{transform:rotateY(180deg)}
  .fface.back .ft{color:var(--green);font-size:1.05rem}
  .fhint{text-align:center;color:var(--muted);font-size:.82rem;margin-top:12px}

  /* results */
  .res{padding:32px;text-align:center}
  .scorewrap{position:relative;width:190px;height:190px;margin:6px auto 4px}
  .scorewrap svg{transform:rotate(-90deg)}
  .scorewrap .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:850;font-size:2.9rem;letter-spacing:-.03em}
  .scorewrap .num small{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block}
  .pill{display:inline-block;padding:7px 16px;border-radius:99px;font-weight:800;font-size:.82rem;letter-spacing:.04em;margin-top:6px}
  .pill.pass{background:rgba(51,209,122,.16);color:var(--green)}.pill.fail{background:rgba(255,90,82,.16);color:var(--red)}
  .kv{display:flex;justify-content:center;gap:20px;margin-top:14px;color:var(--muted);font-size:.85rem;flex-wrap:wrap}.kv b{color:var(--text)}
  .catrow{display:flex;align-items:center;gap:12px;margin-bottom:11px;text-align:left}
  .catrow .cn{flex:1;min-width:0;font-size:.9rem;font-weight:600}.catrow .cn span{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
  .track{flex:1.2;height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .track>i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s cubic-bezier(.22,1,.36,1)}
  .catrow .pct{width:50px;text-align:right;font-weight:800;font-size:.86rem;font-variant-numeric:tabular-nums}
  .focus{padding:18px;margin-bottom:11px;border-left:4px solid var(--amber);text-align:left}
  .focus.strong{border-left-color:var(--red)}
  .focus h4{margin:0 0 3px;font-size:1rem}.focus .sc{color:var(--amber);font-weight:800;font-size:.82rem}.focus.strong .sc{color:var(--red)}
  .focus p{color:var(--muted);font-size:.86rem;margin:8px 0 0}.focus a{color:var(--accent);text-decoration:none;font-weight:700;font-size:.84rem}
  .focus .drill{margin-top:10px;padding:9px 15px;font-size:.85rem;border-radius:11px}
  .allgood{padding:20px;text-align:center;color:var(--green);font-weight:700}
  .rev{text-align:left;padding:15px 17px;margin-bottom:10px;border-left:3px solid var(--red);font-size:.88rem;border-radius:12px;background:rgba(255,255,255,.03)}
  .rev.flag{border-left-color:var(--amber)} .rev .q{font-weight:650}.rev .a{color:var(--green);margin-top:4px}

  .confetti{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;z-index:99;pointer-events:none;animation:confetti linear forwards}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:120;background:var(--card-solid);border:1px solid var(--hair);
    border-radius:14px;padding:12px 18px;box-shadow:var(--shadow);font-weight:700;font-size:.9rem;animation:toastIn 3.4s ease forwards;display:flex;align-items:center;gap:10px}
  .toast .bi{font-size:1.3rem}
</style>
</head>
<body>
<svg width="0" height="0"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ff6a2b"/><stop offset="1" stop-color="#ffab3d"/></linearGradient></defs></svg>
<div class="wrap"><div id="app"></div></div>

<script src="data.js"></script>
<script>
/* ============ data prep ============ */
QUESTIONS.forEach((q,i)=>q.id=i);
const byCat = {}; CAT_ORDER.forEach(k=>byCat[k]=QUESTIONS.filter(q=>q.cat===k).map(q=>q.id));

/* ============ persistent store ============ */
const SK='splunk-trainer-v2';
const DEFAULTS={v:2,xpTotal:0,passes:0,attempts:0,bestScore:0,catMastery:{},missedIds:[],badges:[],dailyStreak:0,lastStudyDate:'',theme:'auto',sound:true};
function loadStore(){ try{ const raw=localStorage.getItem(SK); if(raw) return Object.assign({},DEFAULTS,JSON.parse(raw)); }catch(e){} return Object.assign({},DEFAULTS); }
function saveStore(){ try{ localStorage.setItem(SK,JSON.stringify(store)); }catch(e){} }
const store=loadStore();

/* ============ helpers ============ */
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
function show(n){app.innerHTML='';app.appendChild(n);}
const app=document.getElementById('app');
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function eq(a,b){if(a.length!==b.length)return false;const s=[...a].sort(),t=[...b].sort();return s.every((v,i)=>v===t[i]);}
function levelInfo(xp){const per=150;const lvl=Math.floor(xp/per)+1;return{lvl,into:xp%per,per,pct:Math.round((xp%per)/per*100)};}
function dstr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function markStudiedToday(){const t=dstr(new Date());if(store.lastStudyDate===t)return;const y=dstr(new Date(Date.now()-86400000));store.dailyStreak=(store.lastStudyDate===y)?(store.dailyStreak||0)+1:1;store.lastStudyDate=t;saveStore();}

/* ============ theme + sound ============ */
function applyTheme(){const t=store.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);}
function cycleTheme(){store.theme=store.theme==='auto'?'dark':store.theme==='dark'?'light':'auto';saveStore();applyTheme();rerenderTop();}
function themeIcon(){return store.theme==='auto'?'🌓':store.theme==='dark'?'🌙':'☀️';}
let actx;
function beep(ok){if(!store.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='sine';o.frequency.value=ok?880:210;g.gain.value=.06;o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.28);o.stop(actx.currentTime+.3);}catch(e){}}
function toggleSound(){store.sound=!store.sound;saveStore();rerenderTop();}

/* ============ badges ============ */
const BADGES=[
 {id:'first',icon:'🎓',name:'First Steps',desc:'Complete your first exam',t:s=>s.completed},
 {id:'pass',icon:'✅',name:'Passing Grade',desc:'Score 75% or higher',t:s=>s.pass},
 {id:'perfect',icon:'💯',name:'Flawless',desc:'Score 100% on an exam',t:s=>s.pct===100},
 {id:'streak10',icon:'🔥',name:'On Fire',desc:'Hit a 10-answer streak',t:s=>s.bestStreak>=10},
 {id:'catmaster',icon:'🧠',name:'Category Master',desc:'100% in a category (full exam)',t:s=>s.full&&s.perfectCat},
 {id:'speed',icon:'⚡',name:'Speed Demon',desc:'Finish timed exam with 10+ min left',t:s=>s.mode==='exam'&&s.timeLeft>=600&&s.completed},
 {id:'grinder',icon:'📅',name:'Dedicated',desc:'3-day study streak',t:()=>store.dailyStreak>=3},
 {id:'century',icon:'🏆',name:'Century Club',desc:'Earn 1000 total XP',t:()=>store.xpTotal>=1000},
];
function awardBadges(session){const earned=[];BADGES.forEach(b=>{if(!store.badges.includes(b.id)&&b.t(session)){store.badges.push(b.id);earned.push(b);}});if(earned.length){saveStore();earned.forEach((b,i)=>setTimeout(()=>toast(b.icon,'Badge unlocked: '+b.name),700+i*900));}return earned;}
function toast(icon,msg){const t=$(`<div class="toast"><span class="bi">${icon}</span>${msg}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),3600);}

/* ============ app state ============ */
const S={exam:null,mode:'practice',order:[],idx:0,answers:{},score:0,streak:0,best:0,xp:0,answered:false,perCat:{},missed:[],flags:new Set(),timer:null,timeLeft:0,onKey:null,qCount:0};
document.addEventListener('keydown',e=>{if(S.onKey)S.onKey(e);});

/* ============ top bar (theme/sound) ============ */
function topBar(){return `<div class="topbar">
  <button class="iconbtn" id="ttheme" title="Theme">${themeIcon()}</button>
  <button class="iconbtn" id="tsound" title="Sound">${store.sound?'🔊':'🔇'}</button></div>`;}
function wireTop(v){const a=v.querySelector('#ttheme'),b=v.querySelector('#tsound');if(a)a.onclick=cycleTheme;if(b)b.onclick=toggleSound;}
let currentRender=()=>menu();
function rerenderTop(){currentRender();}

/* ============ MENU + dashboard ============ */
function dashboard(){
  const li=levelInfo(store.xpTotal);
  // strongest/weakest category by mastery (min 1 attempt)
  const cats=CAT_ORDER.map(k=>{const m=store.catMastery[k];return m&&m.t?{k,acc:m.c/m.t,t:m.t}:null}).filter(Boolean);
  let strong=null,weak=null;
  if(cats.length){const s=[...cats].sort((a,b)=>b.acc-a.acc);strong=s[0];weak=s[s.length-1];}
  const badgeHTML=BADGES.map(b=>`<div class="bdg ${store.badges.includes(b.id)?'':'locked'}" title="${b.name}: ${b.desc}">${b.icon}</div>`).join('');
  return `<div class="glass dash">
    <div class="lvlrow">
      <div class="lvlbadge">${li.lvl}</div>
      <div class="lvlmeta"><div class="t">Level ${li.lvl}</div><div class="s">${store.xpTotal} XP · ${li.into}/${li.per} to next level</div>
        <div class="xpbar"><i data-w="${li.pct}"></i></div></div>
    </div>
    <div class="dstats">
      <div class="dstat"><b>${store.attempts}</b><span>Exams</span></div>
      <div class="dstat"><b>${store.bestScore}%</b><span>Best</span></div>
      <div class="dstat"><b>${store.passes}</b><span>Passes</span></div>
      <div class="dstat"><b>🔥 ${store.dailyStreak}</b><span>Day streak</span></div>
    </div>
    ${strong?`<div class="swrow">
      <div class="swtag str"><b>Strongest</b>${CATEGORIES[strong.k].name} · ${Math.round(strong.acc*100)}%</div>
      <div class="swtag weak"><b>Focus on</b>${CATEGORIES[weak.k].name} · ${Math.round(weak.acc*100)}%</div></div>`:``}
    <div class="badges">${badgeHTML}</div>
  </div>`;
}
function menu(){
  currentRender=menu;
  const ready=EXAMS.find(e=>e.status==='ready');
  const cards=EXAMS.map(e=>`<div class="glass exam ${e.status==='ready'?'ready':'locked'}" data-id="${e.id}">
    <span class="badge ${e.status==='ready'?'ready':'soon'}">${e.status==='ready'?'Ready':'Coming soon'}</span>
    <div class="ico" style="background:linear-gradient(180deg,${e.color},${e.color}bb)">${e.icon}</div>
    <div class="code">${e.code?e.code+' · ':''}${e.level}</div><h3>${e.name}</h3><p class="tl">${e.tagline}</p>
    ${e.due?`<div class="due">🗓 Due ${e.due}</div>`:''}
    ${e.status==='ready'?`<div class="go">▶ Start studying</div>`:(e.url?`<a class="official" href="${e.url}" target="_blank" rel="noopener">Official exam page ↗</a>`:`<div class="soonhint">Coming soon</div>`)}</div>`).join('');
  const v=$(`<div class="view">${topBar()}
    <div class="brand"><div class="logo">🔍</div><h1>Splunk Certification Trainer</h1><p>Your onboarding cert path</p></div>
    ${ready?`<button class="hero-cta" id="quickstart"><span>▶ Start ${ready.name}</span><small>${QUESTIONS.length} questions · choose a mode next</small></button>`:''}
    ${dashboard()}
    <div class="section-title" style="text-align:center">Choose an exam</div>
    <div class="grid">${cards}</div>
    <div class="path">Your certification journey: <b style="color:var(--text)">Core Power User</b> → Enterprise Admin → Cloud Admin → Enterprise Architect</div></div>`);
  wireTop(v);
  const qs=v.querySelector('#quickstart'); if(qs)qs.onclick=()=>{S.exam=ready;examInfo();};
  v.querySelectorAll('.exam').forEach(c=>{if(!c.classList.contains('locked'))c.onclick=()=>{S.exam=EXAMS.find(e=>e.id===c.dataset.id);examInfo();};});
  show(v);
  requestAnimationFrame(()=>{const b=v.querySelector('.xpbar>i');if(b)b.style.width=b.dataset.w+'%';});
}

/* ============ EXAM INFO + mode picker ============ */
function examInfo(){
  currentRender=examInfo;
  const e=S.exam;
  const hasMissed=store.missedIds.length>0;
  const catCard=k=>{const c=CATEGORIES[k];return `<div class="glass cat"><div class="w">${c.weight}%</div><div class="body"><b>${c.name}</b><p>${c.blurb}</p></div><a href="${c.doc}" target="_blank" rel="noopener">Docs →</a></div>`;};
  const cats3=CAT_ORDER.slice(0,3).map(catCard).join('');
  const catsRest=CAT_ORDER.slice(3).map(catCard).join('');
  const modes=`
    <div class="glass mode rec" data-m="practice"><div class="mi">📝</div><div><b>Practice<span class="rectag">Start here</span></b><p>All ${QUESTIONS.length} questions, instant feedback + docs.</p></div><div class="arr">›</div></div>
    <div class="glass mode" data-m="exam"><div class="mi">⏱️</div><div><b>Timed Exam</b><p>${e.minutes}-min countdown, feedback at the end.</p></div><div class="arr">›</div></div>
    <div class="glass mode" data-m="challenge"><div class="mi">⚡</div><div><b>Challenge Round</b><p>The ${QUESTIONS.filter(q=>q.hard).length} hardest questions.</p></div><div class="arr">›</div></div>
    <div class="glass mode" data-m="flash"><div class="mi">🃏</div><div><b>Flashcards</b><p>Flip through the ${QUESTIONS.length} exam questions.</p></div><div class="arr">›</div></div>
    <div class="glass mode" data-m="review"><div class="mi">📖</div><div><b>Rapid Review</b><p>${REVIEW.length} quick facts, grouped by topic.</p></div><div class="arr">›</div></div>
    <div class="glass mode ${hasMissed?'':'dis'}" data-m="missed"><div class="mi">🔁</div><div><b>Review Missed</b><p>${hasMissed?`Re-quiz the ${store.missedIds.length} you've missed.`:'Take a quiz first to unlock.'}</p></div>${hasMissed?'<div class="arr">›</div>':''}</div>`;
  const v=$(`<div class="view">${topBar()}
    <button class="back">← All exams</button>
    <div class="glass hero"><div class="ico" style="background:linear-gradient(180deg,${e.color},${e.color}bb)">${e.icon}</div>
      <div class="code">${e.code?e.code+' · ':''}${e.level}</div><h2>${e.name}</h2>
      ${e.due?`<div class="duebadge">🗓 Target: ${e.due}${e.dueNote?` · ${e.dueNote}`:''}</div>`:''}
      <p>${e.about}</p>
      <div class="stats"><div class="stat"><b>${QUESTIONS.length}</b><span>Practice Qs</span></div>
        <div class="stat"><b>${e.realQ||'-'}</b><span>Real exam Qs</span></div>
        <div class="stat"><b>${e.minutes}<small style="font-size:.9rem"> min</small></b><span>Real exam</span></div></div>
      <div class="facts">${e.facts.map(f=>`<div class="fact">✓ ${f}</div>`).join('')}</div>
      ${e.url?`<div class="doclink" style="margin-top:14px">🔗 <a href="${e.url}" target="_blank" rel="noopener">Official Splunk exam page →</a></div>`:''}</div>
    <div class="section-title">👉 Tap a mode to start</div>
    <div class="modes">${modes}</div>
    <div class="lenrow"><span class="lenlabel">Questions <span style="color:var(--muted);font-weight:500;font-size:.8rem">· Practice &amp; Timed Exam</span></span>
      <div class="segmented" id="qcount">${[['10',10],['20',20],['30',30],['50',50],['All',0]].map(x=>`<button class="seg ${S.qCount===x[1]?'on':''}" data-n="${x[1]}">${x[0]}</button>`).join('')}</div></div>
    <div class="toggle"><input type="checkbox" id="shuf" checked> <label for="shuf">Shuffle question order</label></div>
    <div class="section-title">Or drill a single category</div>
    <div class="glass" style="padding:8px"><select id="drillsel" style="width:100%;padding:14px;border-radius:14px;background:transparent;color:var(--text);border:0;font:inherit;font-weight:600">
      <option value="">Pick a category to drill…</option>
      ${CAT_ORDER.map(k=>`<option value="${k}">${CATEGORIES[k].name} (${byCat[k].length} Q)</option>`).join('')}
    </select></div>
    <div class="section-title">Exam blueprint · 10 categories</div>
    ${cats3}
    <div id="bpmore" style="display:none">${catsRest}</div>
    <button class="ghost seemore" id="bptoggle">See all 10 categories ↓</button></div>`);
  wireTop(v);
  v.querySelector('.back').onclick=menu;
  const shuf=()=>v.querySelector('#shuf').checked;
  v.querySelectorAll('.mode').forEach(m=>{if(m.classList.contains('dis'))return;m.onclick=()=>{
    const mode=m.dataset.m;
    if(mode==='flash'){startDeck(questionDeck(),shuf(),'Flashcards',examInfo);return;}
    if(mode==='review'){reviewPicker();return;}
    if(mode==='challenge'){startQuiz('challenge',QUESTIONS.filter(q=>q.hard).map(q=>q.id),shuf());return;}
    if(mode==='missed'){startQuiz('missed',store.missedIds.filter(id=>QUESTIONS[id]),shuf());return;}
    let ids=QUESTIONS.map(q=>q.id); if(shuf())ids=shuffled(ids); if(S.qCount>0)ids=ids.slice(0,S.qCount);
    startQuiz(mode, ids, false);
  };});
  v.querySelectorAll('#qcount .seg').forEach(s=>s.onclick=()=>{S.qCount=+s.dataset.n; v.querySelectorAll('#qcount .seg').forEach(x=>x.classList.toggle('on',x===s));});
  v.querySelector('#drillsel').onchange=(ev)=>{const k=ev.target.value;if(k)startQuiz('drill',byCat[k].slice(),true);};
  const more=v.querySelector('#bpmore'), tg=v.querySelector('#bptoggle');
  tg.onclick=()=>{const open=more.style.display!=='none';more.style.display=open?'none':'block';tg.textContent=open?'See all 10 categories ↓':'See less ↑';};
  show(v);
}

/* ============ QUIZ engine ============ */
function startQuiz(mode,ids,shuffle){
  if(!ids||!ids.length){toast('⚠️','Nothing to quiz here yet.');return;}
  clearTimer();
  markStudiedToday();
  S.mode=mode; S.order=shuffle?shuffled(ids):ids.slice();
  S.idx=0;S.score=0;S.streak=0;S.best=0;S.xp=0;S.perCat={};S.missed=[];S.answers={};S.flags=new Set();
  if(mode==='exam'){S.timeLeft=((S.exam&&S.exam.minutes)||57)*60;startTimer();}
  question();
}
function clearTimer(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
function startTimer(){clearTimer();S.timer=setInterval(()=>{S.timeLeft--;paintTimer();if(S.timeLeft<=0){clearTimer();finish();}},1000);}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return m+':'+String(ss).padStart(2,'0');}
function paintTimer(){const t=document.getElementById('timerchip');if(t){t.textContent='⏱ '+fmtTime(S.timeLeft);t.classList.toggle('warn',S.timeLeft<=300);}}
function ringSVG(v){const r=18,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 46 46"><circle class="bgc" cx="23" cy="23" r="${r}"/><circle class="fg" cx="23" cy="23" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v)}"/></svg>`;}

function question(){
  currentRender=question;
  const Q=QUESTIONS[S.order[S.idx]],multi=Q.a.length>1,exam=S.mode==='exam';
  const prevPick=S.answers[Q.id]||[];
  const bar=`<div class="glass qbar">${ringSVG(S.idx/S.order.length)}
    <div class="lbl">Question<b>${S.idx+1} / ${S.order.length}</b></div><div class="spacer"></div>
    ${exam?`<div class="chip timer" id="timerchip">⏱ ${fmtTime(S.timeLeft)}</div>`:
       `<div class="chip streak ${S.streak>1?'on':''}"><span class="fi">🔥</span>${S.streak}</div><div class="chip xp">✦ ${S.xp}</div>`}
    <button class="flagbtn ${S.flags.has(Q.id)?'on':''}" id="flag" title="Flag for review">⚑</button></div>`;
  const opts=Q.o.map((o,i)=>`<label class="opt ${exam&&prevPick.includes(i)?'picked':''}" data-i="${i}">
    <input type="${multi?'checkbox':'radio'}" name="o" value="${i}" ${prevPick.includes(i)?'checked':''}><span>${o}</span><span class="kbd">${i+1}</span></label>`).join('');
  const v=$(`<div class="view"><button class="back" id="qexit">← Exit</button>${bar}<div class="glass qcard">
    <div class="qcat">${CATEGORIES[Q.cat].name}${Q.hard?`<span class="chall">⚡ Challenge</span>`:''}${S.mode==='drill'?' · drill':S.mode==='missed'?' · review':''}</div>
    <p class="qtext">${Q.q}</p>${multi?`<p class="multi">✔ Select all that apply</p>`:``}
    <div class="opts" id="opts">${opts}</div><div id="ex"></div>
    <div class="qnav">
      ${exam?`<button id="next">${S.idx===S.order.length-1?'Finish exam →':'Next →'}</button>${S.idx>0?`<button id="prev" class="ghost">← Back</button>`:''}<button id="fin" class="ghost">Finish now</button>`
            :`<button id="submit">Submit answer</button><button id="next" class="ghost" style="display:none">${S.idx===S.order.length-1?'See results →':'Next question →'}</button>`}
    </div></div></div>`);
  const flag=v.querySelector('#flag');flag.onclick=()=>{S.flags.has(Q.id)?S.flags.delete(Q.id):S.flags.add(Q.id);flag.classList.toggle('on');};
  v.querySelector('#qexit').onclick=()=>{clearTimer();S.onKey=null;examInfo();};
  if(exam){
    v.querySelector('#next').onclick=()=>{recordExam(v,Q);if(S.idx===S.order.length-1)finish();else{S.idx++;question();}};
    const p=v.querySelector('#prev');if(p)p.onclick=()=>{recordExam(v,Q);S.idx--;question();};
    v.querySelector('#fin').onclick=()=>{recordExam(v,Q);finish();};
  }else{
    v.querySelector('#submit').onclick=()=>gradeNow(v,Q);
    v.querySelector('#next').onclick=()=>{S.idx++;S.idx<S.order.length?question():finish();};
  }
  S.answered=false;
  S.onKey=(e)=>{
    if(e.key>='1'&&e.key<=String(Q.o.length)){const i=+e.key-1;const inp=v.querySelector(`.opt[data-i="${i}"] input`);if(inp&&!inp.disabled){if(multi)inp.checked=!inp.checked;else inp.checked=true;}e.preventDefault();}
    else if(e.key==='Enter'){if(exam){v.querySelector('#next').click();}else{if(!S.answered)v.querySelector('#submit').click();else v.querySelector('#next').click();}e.preventDefault();}
    else if(e.key.toLowerCase()==='f'){flag.click();}
  };
  show(v);
}
function recordExam(v,Q){const picked=[...v.querySelectorAll('#opts input:checked')].map(x=>+x.value);S.answers[Q.id]=picked;}
function tally(Q,picked){
  const pc=S.perCat[Q.cat]||(S.perCat[Q.cat]={c:0,t:0});pc.t++;
  const ok=picked.length&&eq(picked,Q.a);
  const m=store.catMastery[Q.cat]||(store.catMastery[Q.cat]={c:0,t:0});m.t++;
  if(ok){pc.c++;m.c++;S.score++;S.streak++;S.best=Math.max(S.best,S.streak);const g=10+Math.max(0,(S.streak-1)*2);S.xp+=g;
    const mi=store.missedIds.indexOf(Q.id);if(mi>=0)store.missedIds.splice(mi,1);return g;}
  else{S.streak=0;S.missed.push({q:Q.q,a:Q.a.map(i=>Q.o[i]).join(', '),e:Q.e,doc:Q.d,flag:S.flags.has(Q.id)});if(!store.missedIds.includes(Q.id))store.missedIds.push(Q.id);return 0;}
}
function gradeNow(v,Q){
  if(S.answered)return;
  const picked=[...v.querySelectorAll('#opts input:checked')].map(x=>+x.value);
  if(!picked.length)return;
  S.answered=true;
  const ok=eq(picked,Q.a);const g=tally(Q,picked);beep(ok);
  v.querySelectorAll('#opts .opt').forEach(o=>{const i=+o.dataset.i;o.classList.add('disabled');o.querySelector('input').disabled=true;
    if(Q.a.includes(i))o.classList.add('correct');else if(picked.includes(i))o.classList.add('wrong');else o.classList.add('dim');});
  v.querySelector('#ex').innerHTML=`<div class="glass explain"><div class="v ${ok?'ok':'no'}">${ok?'✓ Correct':'✕ Incorrect'}${ok&&g?`<span class="plusxp">+${g} XP</span>`:''}</div>${Q.e}<div class="doclink">📖 <a href="${Q.d}" target="_blank" rel="noopener">Read the official Splunk docs →</a></div></div>`;
  const sc=v.querySelector('.chip.streak');if(sc){sc.classList.toggle('on',S.streak>1);sc.innerHTML=`<span class="fi">🔥</span>${S.streak}`;}
  const xc=v.querySelector('.chip.xp');if(xc)xc.innerHTML=`✦ ${S.xp}`;
  v.querySelector('#submit').style.display='none';
  const nx=v.querySelector('#next');nx.style.display='inline-block';nx.focus();
}
function finish(){
  clearTimer();S.onKey=null;
  // In exam mode, grade all now from S.answers
  if(S.mode==='exam'){S.score=0;S.streak=0;S.best=0;S.xp=0;S.perCat={};S.missed=[];
    S.order.forEach(id=>{const Q=QUESTIONS[id];tally(Q,S.answers[id]||[]);});}
  const total=S.order.length,pct=total?Math.round(S.score/total*100):0,pass=pct>=75;
  const full=(S.mode==='practice'||S.mode==='exam');
  // persistence
  store.xpTotal+=S.xp;
  if(full){store.attempts++;store.bestScore=Math.max(store.bestScore,pct);if(pass)store.passes++;}
  // perfect category (full exams only)
  let perfectCat=false;if(full)Object.values(S.perCat).forEach(p=>{if(p.t>=3&&p.c===p.t)perfectCat=true;});
  saveStore();
  const session={completed:true,pass,pct,bestStreak:S.best,mode:S.mode,timeLeft:S.timeLeft,full,perfectCat,catsAttempted:Object.keys(S.perCat).length};
  const earned=full?awardBadges(session):[];
  results(pct,pass,total,earned);
}

/* ============ RESULTS ============ */
function results(pct,pass,total,earned){
  currentRender=()=>results(pct,pass,total,[]);
  const r=52,c=2*Math.PI*r;
  const cats=CAT_ORDER.filter(k=>S.perCat[k]).map(k=>{const p=S.perCat[k],acc=Math.round(p.c/p.t*100);const col=acc>=75?'var(--green)':acc>=50?'var(--amber)':'var(--red)';return{k,acc,p,col};});
  const bars=cats.map(x=>`<div class="catrow"><div class="cn">${CATEGORIES[x.k].name}<span>${x.p.c}/${x.p.t} correct</span></div>
    <div class="track"><i data-w="${x.acc}" style="background:${x.col}"></i></div><div class="pct" style="color:${x.col}">${x.acc}%</div></div>`).join('');
  const weak=cats.filter(x=>x.acc<75).sort((a,b)=>a.acc-b.acc);
  const focus=weak.length?weak.map(x=>`<div class="glass focus ${x.acc<50?'strong':''}"><h4>${CATEGORIES[x.k].name} <span class="sc">· ${x.acc}%</span></h4>
    <p>${CATEGORIES[x.k].blurb}</p><p style="margin-top:10px"><a href="${CATEGORIES[x.k].doc}" target="_blank" rel="noopener">📖 Brush up in the Splunk docs →</a></p>
    <button class="drill" data-k="${x.k}">Drill ${byCat[x.k].length} ${CATEGORIES[x.k].name.split(' ')[0]} questions →</button></div>`).join('')
    :`<div class="glass allgood">🎯 No weak areas - every category at 75%+. Nicely done!</div>`;
  const missedSorted=[...S.missed].sort((a,b)=>(b.flag?1:0)-(a.flag?1:0));
  const review=S.missed.length?`<div class="section-title">Review · ${S.missed.length} missed${S.flags.size?` · ${[...S.flags].length} flagged`:''}</div>`+
    missedSorted.map(m=>`<div class="rev ${m.flag?'flag':''}"><div class="q">${m.flag?'⚑ ':''}${m.q}</div><div class="a">Answer: ${m.a}</div><div style="color:var(--muted);margin-top:4px">${m.e}</div><div class="doclink">📖 <a href="${m.doc}" target="_blank" rel="noopener">Docs →</a></div></div>`).join(''):'';
  const modeLabel={practice:'Practice',exam:'Timed Exam',drill:'Category Drill',missed:'Review Missed',challenge:'Challenge Round'}[S.mode]||'Practice';
  const v=$(`<div class="view">${topBar()}
    <div class="glass res"><div class="scorewrap"><svg width="190" height="190">
      <circle cx="95" cy="95" r="${r}" fill="none" stroke="var(--hair)" stroke-width="11"/>
      <circle id="scircle" cx="95" cy="95" r="${r}" fill="none" stroke="${pass?'var(--green)':'var(--red)'}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.22,1,.36,1)"/></svg>
      <div class="num"><span><span id="scoreN" style="color:${pass?'var(--green)':'var(--red)'}">0%</span><small>${modeLabel}</small></span></div></div>
      <div class="pill ${pass?'pass':'fail'}">${pass?'PASS':'BELOW PASSING'}</div>
      <div class="kv"><div><b>${S.score}</b>/${total} correct</div><div>🔥 best <b>${S.best}</b></div><div>✦ <b>${S.xp}</b> XP earned</div></div></div>
    <div class="section-title">Focus areas ${weak.length?`· ${weak.length} to brush up`:''}</div>${focus}
    <div class="section-title">Category breakdown</div><div class="glass" style="padding:20px 18px">${bars||'<span style="color:var(--muted)">No categories</span>'}</div>
    ${review}
    <div class="qnav" style="margin-top:20px"><button id="retake">Retake</button><button id="info" class="ghost">Exam menu</button><button id="home" class="ghost">← All exams</button></div></div>`);
  wireTop(v);
  v.querySelector('#retake').onclick=()=>startQuiz(S.mode, S.mode==='missed'?store.missedIds.filter(id=>QUESTIONS[id]):S.order.slice(), true);
  v.querySelector('#info').onclick=examInfo;
  v.querySelector('#home').onclick=menu;
  v.querySelectorAll('.drill').forEach(b=>b.onclick=()=>startQuiz('drill',byCat[b.dataset.k].slice(),true));
  show(v);
  requestAnimationFrame(()=>{
    v.querySelector('#scircle').style.strokeDashoffset=c*(1-pct/100);
    v.querySelectorAll('.track>i').forEach(i=>i.style.width=i.dataset.w+'%');
    let n=0;const t=setInterval(()=>{n+=Math.max(1,Math.round(pct/28));if(n>=pct){n=pct;clearInterval(t);}v.querySelector('#scoreN').textContent=n+'%';},26);
    if(pass)confetti();
  });
}
function confetti(){const cols=['#ff6a2b','#ffab3d','#33d17a','#6ab8ff','#a45cf5'];
  for(let i=0;i<90;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2.4+Math.random()*1.8)+'s';d.style.animationDelay=Math.random()*.5+'s';d.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(d);setTimeout(()=>d.remove(),4600);}}

/* ============ FLASHCARDS / DECKS ============ */
function questionDeck(){ return QUESTIONS.map(q=>({tag:CATEGORIES[q.cat].name, front:q.q, back:q.a.map(i=>q.o[i]).join(' · '), extra:q.e, doc:q.d})); }
function startDeck(cards, shuffle, title, backFn){
  clearTimer(); markStudiedToday();
  S.deck=cards; S.deckTitle=title||'Flashcards'; S.deckBack=backFn||examInfo;
  S.order=shuffle?shuffled([...cards.keys()]):[...cards.keys()];
  S.idx=0; S.fknown=0; flash();
}
function startReview(cards, shuffle){
  const deck=cards.map(r=>({tag:REVIEW_CATNAME[r.c]||'Rapid Review', front:r.q, back:r.a}));
  startDeck(deck, shuffle, 'Rapid Review', reviewPicker);
}
function flash(){
  currentRender=flash;
  const c=S.deck[S.order[S.idx]];
  const v=$(`<div class="view">${topBar()}
    <div class="glass qbar">${ringSVG(S.idx/S.order.length)}<div class="lbl">${S.deckTitle}<b>${S.idx+1} / ${S.order.length}</b></div><div class="spacer"></div>
      <div class="chip">✓ ${S.fknown} known</div></div>
    <div class="fcstage"><div class="fcard" id="fc">
      <div class="fface front"><div class="tag">${c.tag}</div><div class="ft">${c.front}</div></div>
      <div class="fface back"><div class="tag">Answer</div><div class="ft">${c.back}</div>${c.extra?`<p style="color:var(--muted);font-size:.86rem;margin-top:12px">${c.extra}</p>`:''}${c.doc?`<div class="doclink">📖 <a href="${c.doc}" target="_blank" rel="noopener">Docs →</a></div>`:''}</div>
    </div></div>
    <div class="fhint">Tap the card or press Space to flip</div>
    <div class="qnav" style="margin-top:8px"><button id="know">✓ Got it</button><button id="again" class="ghost">Review again</button><button id="exit" class="ghost">Exit</button></div></div>`);
  wireTop(v);
  const fc=v.querySelector('#fc');let flipped=false;const flip=()=>{flipped=!flipped;fc.classList.toggle('flip',flipped);};
  fc.onclick=flip;
  const nextCard=(known)=>{if(known)S.fknown++;if(S.idx===S.order.length-1){flashDone();}else{S.idx++;flash();}};
  v.querySelector('#know').onclick=()=>nextCard(true);
  v.querySelector('#again').onclick=()=>nextCard(false);
  v.querySelector('#exit').onclick=S.deckBack;
  S.onKey=(e)=>{if(e.key===' '){flip();e.preventDefault();}else if(e.key==='ArrowRight'){nextCard(false);}else if(e.key.toLowerCase()==='k'){nextCard(true);}};
  show(v);
}
function flashDone(){
  S.onKey=null;
  const pct=Math.round(S.fknown/S.order.length*100);
  const v=$(`<div class="view">${topBar()}<div class="glass res">
    <div style="font-size:3rem">🃏</div><h2 style="margin:6px 0">Deck complete</h2>
    <div class="kv"><div>You knew <b>${S.fknown}</b> / ${S.order.length} (${pct}%)</div></div>
    <div class="qnav" style="justify-content:center;margin-top:20px"><button id="again">Shuffle again</button><button id="back" class="ghost">Back</button></div></div></div>`);
  wireTop(v);
  v.querySelector('#again').onclick=()=>startDeck(S.deck,true,S.deckTitle,S.deckBack);
  v.querySelector('#back').onclick=S.deckBack;
  show(v);
}
function reviewPicker(){
  currentRender=reviewPicker;
  const groups=REVIEW_CATS.map(k=>({k,n:REVIEW.filter(r=>r.c===k).length})).filter(g=>g.n);
  const total=REVIEW.length;
  const cards=groups.map(g=>`<div class="glass rcat" data-k="${g.k}"><div class="rcbody"><b>${REVIEW_CATNAME[g.k]}</b><p>${g.n} card${g.n>1?'s':''}</p></div><div class="arr">›</div></div>`).join('');
  const v=$(`<div class="view">${topBar()}
    <button class="back">← Exam menu</button>
    <div class="brand" style="margin-bottom:14px"><div class="logo">📖</div><h1>Rapid Review</h1><p>${total} key facts · flip through by topic</p></div>
    <button class="cta" id="all">🔀 Shuffle all ${total} cards</button>
    <div class="section-title">Or pick a topic</div>
    <div class="rcatgrid">${cards}</div></div>`);
  wireTop(v);
  v.querySelector('.back').onclick=examInfo;
  v.querySelector('#all').onclick=()=>startReview(REVIEW.slice(),true);
  v.querySelectorAll('.rcat').forEach(c=>c.onclick=()=>startReview(REVIEW.filter(r=>r.c===c.dataset.k),true));
  show(v);
}

/* ============ boot ============ */
applyTheme();
menu();
</script>
</body>
</html>
